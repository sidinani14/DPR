<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IDS · Follow-ups</title>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--surface:#1A1A1A;--surface2:#222;--surface3:#2A2A2A;--border:#2E2E2E;--border2:#3A3A3A;--text:#F0EDE8;--text2:#9A9690;--text3:#5A5652;--accent:#C8A96E;--accent-light:rgba(200,169,110,.1);--green:#4A9B6F;--green-light:rgba(74,155,111,.12);--red:#C05050;--red-light:rgba(192,80,80,.12);--amber:#C8863A;--amber-light:rgba(200,134,58,.12);--blue:#4A7FC8;--blue-light:rgba(74,127,200,.12);--purple:#8B6FC8;--purple-light:rgba(139,111,200,.12);--radius:10px;--radius-sm:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
.header-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo-text{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--accent)}
.logo-sub{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px}
.refresh-btn{padding:7px 12px;font-size:11px;color:var(--accent);background:var(--accent-light);border:1px solid var(--accent-light);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif}
.status-line{padding:6px 20px 0;max-width:820px;margin:0 auto;font-size:11px;color:var(--text3)}
.wrap{max-width:820px;margin:0 auto;padding:18px 20px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:0;text-transform:none}
.empty{text-align:center;color:var(--text3);font-size:12px;padding:18px}
.skel{height:60px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--radius);margin-bottom:16px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
table{width:100%;border-collapse:collapse}
th{padding:3.5px 6px;font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);text-align:left}
td{padding:7px 6px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:last-child td{border-bottom:none}
.freshness-days{font-family:'DM Mono',monospace;font-weight:700}
.filter-chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}
.chip.on{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:500}
.item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.item-proj{font-size:12px;font-weight:600;color:var(--text)}
.item-meta{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.item-text{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:6px}
.tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px}
.tag-IDS{background:var(--blue-light);color:var(--blue)}
.tag-Client{background:var(--green-light);color:var(--green)}
.tag-Contractor{background:var(--amber-light);color:var(--amber)}
.tag-Other{background:rgba(255,255,255,.08);color:var(--text2)}
.item-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.owner-badge{font-size:11px;color:var(--text);background:var(--surface2);padding:3px 9px;border-radius:12px}
.owner-badge.unassigned{color:var(--red);background:var(--red-light)}
.task-badge{font-size:10px;color:var(--green);background:var(--green-light);padding:3px 9px;border-radius:12px}
.deadline-badge{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.assign-btn,.status-sel{font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif}
.assign-btn:hover{border-color:var(--accent);color:var(--accent)}
.assign-form{display:none;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.assign-form.open{display:flex}
.assign-form input{font-size:12px;padding:6px 9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface3);color:var(--text);font-family:'DM Sans',sans-serif}
.assign-form input[type=text]{width:160px}
.assign-form button{font-size:11px;padding:6px 12px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#1A1A1A;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div>
      <div class="logo-text">IDEAFORM · Follow-ups</div>
      <div class="logo-sub">DPER freshness · Open action items</div>
    </div>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</div>
<div class="status-line" id="status-line">Loading…</div>
<div class="wrap" id="wrap">
  <div class="skel"></div><div class="skel"></div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
let TEAM_NAMES = [];
let allItems = [];
let curFilter = 'all';

async function post(action, extra){
  const r = await fetch(APPS_SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({action, idToken: window.IDS_TOKEN}, extra||{}))});
  return r.json();
}

function daysColor(d){
  if (d == null) return 'var(--red)';
  if (d <= 2) return 'var(--green)';
  if (d <= 5) return 'var(--amber)';
  return 'var(--red)';
}

function renderFreshness(d){
  const rows = d.rows || [];
  if (!rows.length) return `<div class="card"><div class="card-title">DPER Update Freshness</div><div class="empty">No active projects configured (CONFIG "DEEPAK ACTIVE PROJECTS").</div></div>`;
  const trs = rows.map(r => `<tr>
    <td style="font-weight:600">${esc(r.project)}</td>
    <td>${r.lastUpdate || '<span style="color:var(--red)">never</span>'}</td>
    <td class="freshness-days" style="color:${daysColor(r.daysSince)}">${r.daysSince == null ? 'never' : r.daysSince + 'd ago'}</td>
  </tr>`).join('');
  return `<div class="card">
    <div class="card-title">DPER Update Freshness <span class="pill" style="background:var(--surface3);color:var(--text2)">${rows.length} projects</span></div>
    <table><thead><tr><th>Project</th><th>Last Update</th><th>Days Since</th></tr></thead><tbody>${trs}</tbody></table>
  </div>`;
}

function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

function itemHtml(it){
  const ownerHtml = it.owner
    ? `<span class="owner-badge">${esc(it.owner)}</span>`
    : `<span class="owner-badge unassigned">Unassigned</span>`;
  const taskHtml = it.taskId ? `<span class="task-badge">✓ Task ${esc(it.taskId)}</span>` : '';
  const canAssign = !it.taskId;
  const statusSel = `<select class="status-sel" onchange="changeStatus('${it.itemId}', this.value)">
    ${['Open','Revised','Carried','Done'].map(s=>`<option value="${s}" ${s===it.status?'selected':''}>${s}</option>`).join('')}
  </select>`;
  return `<div class="item" id="item-${it.itemId}">
    <div class="item-head">
      <div class="item-proj">${esc(it.project)} <span class="tag tag-${it.category}">${esc(it.category)}</span></div>
      <div class="item-meta">${it.date||''} · logged ${esc(it.logId)}</div>
    </div>
    <div class="item-text">${esc(it.task)}</div>
    <div class="item-foot">
      ${ownerHtml}${taskHtml}
      ${it.deadline?`<span class="deadline-badge">due ${esc(it.deadline)}</span>`:''}
      ${statusSel}
      ${canAssign?`<button class="assign-btn" onclick="toggleAssign('${it.itemId}')">${it.owner?'Reassign + create task':'Assign'}</button>`:''}
    </div>
    ${canAssign?`<div class="assign-form" id="assign-form-${it.itemId}">
      <input type="text" id="assign-owner-${it.itemId}" list="team-list" placeholder="Owner name" value="${esc(it.owner)}">
      <input type="date" id="assign-deadline-${it.itemId}" value="${esc(it.deadline)}">
      <button onclick="confirmAssign('${it.itemId}')">Create task</button>
    </div>`:''}
  </div>`;
}

function renderItems(){
  const filtered = curFilter === 'unassigned' ? allItems.filter(it => !it.taskId) : allItems;
  const wrap = document.getElementById('items-wrap');
  if (!wrap) return;
  wrap.innerHTML = filtered.length
    ? filtered.map(itemHtml).join('')
    : `<div class="empty">Nothing open here 🎉</div>`;
}

function setFilter(f){
  curFilter = f;
  document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  renderItems();
}

function toggleAssign(itemId){
  const el = document.getElementById('assign-form-'+itemId);
  if (el) el.classList.toggle('open');
}

async function confirmAssign(itemId){
  const owner = (document.getElementById('assign-owner-'+itemId).value||'').trim();
  const deadline = document.getElementById('assign-deadline-'+itemId).value||'';
  if (!owner) { alert('Pick an owner first.'); return; }
  const res = await post('assignDecisionLogItem', {itemId, owner, deadline});
  if (res.status === 'ok') {
    const it = allItems.find(x => x.itemId === itemId);
    if (it) { it.owner = owner; it.deadline = deadline; it.taskId = res.taskId; }
    renderItems();
  } else {
    alert('Could not assign: ' + (res.message||'failed'));
  }
}

async function changeStatus(itemId, status){
  const res = await post('setDecisionLogStatus', {itemId, status});
  if (res.status === 'ok') {
    if (status === 'Done') {
      allItems = allItems.filter(x => x.itemId !== itemId);
      renderItems();
    } else {
      const it = allItems.find(x => x.itemId === itemId);
      if (it) it.status = status;
    }
  } else {
    alert('Could not update status: ' + (res.message||'failed'));
  }
}

function renderActionItems(d){
  allItems = d.items || [];
  const unassignedCount = allItems.filter(it => !it.taskId).length;
  return `<div class="card">
    <div class="card-title">Open Action Items <span class="pill" style="background:var(--surface3);color:var(--text2)">${allItems.length} open</span></div>
    <div class="filter-chips">
      <button class="chip on" data-f="all" onclick="setFilter('all')">All</button>
      <button class="chip" data-f="unassigned" onclick="setFilter('unassigned')">Unassigned/No task (${unassignedCount})</button>
    </div>
    <datalist id="team-list">${TEAM_NAMES.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div id="items-wrap"></div>
  </div>`;
}

async function loadAll(){
  document.getElementById('status-line').textContent = 'Loading…';
  try {
    const [lists, fresh, items] = await Promise.all([
      post('getLists'), post('getDperProjectFreshness'), post('getOpenActionItems')
    ]);
    if (lists.status === 'error') throw new Error(lists.message||'forbidden');
    TEAM_NAMES = (lists.team||[]).map(m => m.name).filter(Boolean);
    document.getElementById('wrap').innerHTML = renderFreshness(fresh) + renderActionItems(items);
    renderItems();
    document.getElementById('status-line').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('status-line').textContent = 'Error: ' + e.message;
    document.getElementById('wrap').innerHTML = `<div class="empty">Couldn't load — ${e.message}. This page is restricted to Siddharth &amp; Astha.</div>`;
  }
}

window.idsOnAuth = loadAll;   // gated: runs after authorized sign-in (auth.js)
</script>
</body>
</html>
