<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS · Bulk Task Planning</title>
<script src="auth.js"></script>
<script src="searchselect.js"></script>
<style>:root{--ss-bg:#202020;--ss-fg:#F0EDE8;--ss-pop-bg:#161616;--ss-border:#2E2E2E;--ss-accent:#C8A96E;--ss-muted:#5A5652;--ss-hover:rgba(200,169,110,0.15)}</style>
<script>SearchSelect.auto('.b-project, .b-member, .r-stage');</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--surface:#1A1A1A;--surface2:#202020;--surface3:#2A2A2A;--border:#2E2E2E;--text:#F0EDE8;--text2:#9A9690;--text3:#5A5652;--accent:#C8A96E;--green:#4A9B6F;--red:#E0556B;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:50}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent)}
.logo small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);font-weight:400;margin-top:2px}
.nav-links{display:flex;gap:10px}
.nav-link{font-size:11px;color:var(--text3);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:5px}
.nav-link:hover{color:var(--accent);border-color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:20px}

/* Common form styles */
.field{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;border-radius:6px;padding:9px 11px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* Bulk blocks */
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.block-head{background:var(--surface2);padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.block-head-fields{display:flex;gap:10px;flex:1;flex-wrap:nowrap}
.block-head-fields select{flex:1;min-width:120px;font-size:12px;padding:7px 9px}
.block-head-fields .ss-wrap{flex:1;min-width:120px}
.block-remove{font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:5px;padding:5px 9px;cursor:pointer;margin-left:auto}
.block-remove:hover{color:var(--red);border-color:var(--red)}
.block-body{padding:12px 14px}
/* task rows as cards — description gets its own full-width line */
.trow{border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:var(--surface2)}
.trow-top{display:flex;align-items:center;gap:8px}
.trow-top .ss-wrap{flex:1;min-width:0}
.trow-top>.r-stage{flex:1;min-width:0}
.trow input,.trow select{font-size:12px;padding:6px 7px;border-radius:5px}
.r-units{width:56px;flex-shrink:0}
.r-deadline{width:142px;flex-shrink:0}
.r-desc{width:100%;margin-top:7px}
.del-row{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;border-radius:4px;flex-shrink:0}
.del-row:hover{color:var(--red)}
.add-row-btn{font-size:11px;color:var(--accent);background:rgba(200,169,110,.08);border:1px dashed rgba(200,169,110,.3);border-radius:5px;padding:6px 14px;cursor:pointer;margin-top:8px}
.add-row-btn:hover{background:rgba(200,169,110,.15)}
.pts-badge{font-size:10px;font-family:'DM Mono',monospace;color:var(--accent);white-space:nowrap;padding:0 4px;flex-shrink:0}

.add-block-btn{font-size:12px;font-weight:600;color:var(--accent);background:rgba(200,169,110,.08);border:2px dashed rgba(200,169,110,.25);border-radius:var(--radius);padding:13px;cursor:pointer;width:100%;text-align:center;margin-bottom:20px}
.add-block-btn:hover{background:rgba(200,169,110,.15)}

/* Common meta fields */
.meta-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.meta-row .field{margin:0;flex:1;min-width:160px}

/* Submit */
.submit-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;margin:0 -20px}
.submit-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.submit-btn{font-size:13px;font-weight:700;color:#000;background:var(--accent);border:none;border-radius:7px;padding:11px 28px;cursor:pointer}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-status{font-size:12px;color:var(--text2)}
.submit-count{font-size:12px;font-family:'DM Mono',monospace;color:var(--text3)}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
  <div class="logo">IDEAFORM · Bulk Task Planning<small>plan the week — one block per project</small></div>
  <div class="nav-links">
    <a class="nav-link" href="dashboard.html">Tasks</a>
    <a class="nav-link" href="projects.html">Projects</a>
    <a class="nav-link" href="3m.html">3M Message</a>
  </div>
</div></div>

<div class="wrap">
  <div id="draft-banner" style="display:none;background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--accent);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <span id="draft-banner-text">You have an unsaved task plan.</span>
    <span style="display:flex;gap:8px">
      <button onclick="restoreDraft()" style="font-size:11px;font-weight:600;color:#000;background:var(--accent);border:none;border-radius:5px;padding:5px 12px;cursor:pointer">Restore</button>
      <button onclick="discardDraft()" style="font-size:11px;color:var(--text2);background:none;border:1px solid var(--border);border-radius:5px;padding:5px 12px;cursor:pointer">Discard</button>
    </span>
  </div>
  <!-- Meta row -->
  <div class="meta-row">
    <div class="field"><label>Assigned By</label>
      <select id="meta-by"><option value="">Loading…</option></select></div>
    <div class="field"><label>Date Assigned</label>
      <input type="date" id="meta-date"></div>
  </div>

  <!-- Bulk planning blocks -->
  <div id="blocks-container"></div>
  <button class="add-block-btn" onclick="addBlock()">+ Add Project Block</button>

  <div class="submit-bar">
    <div class="submit-inner">
      <div>
        <div class="submit-count" id="submit-count">0 tasks</div>
        <div class="submit-status" id="submit-status"></div>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submit()">Submit Tasks</button>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
function api(action, extra){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action},extra||{}))}).then(r=>r.json()); }

let CFG = { stages:[], projects:[], allMembers:[] };
let blockCount = 0;

window.idsOnAuth = async function(user){
  try {
    const [lists, cfg] = await Promise.all([api('getLists'), api('getConfig')]);
    CFG.allMembers = (lists && lists.allMembers) ? lists.allMembers : [];
    CFG.projects   = ((lists && lists.projects) ? lists.projects : []).filter(p => p.status !== 'Closed' && p.status !== 'Completed');
    CFG.stages     = ((cfg && cfg.stages) ? cfg.stages : []).filter(s => s.label && !isVisitType(s.label));

    if (!CFG.allMembers.length || !CFG.projects.length) {
      document.getElementById('submit-status').textContent = CFG.allMembers.length ? '' : '⚠ Could not load team list — check connection';
    }

    const byEl = document.getElementById('meta-by');
    byEl.innerHTML = CFG.allMembers.map(m=>`<option value="${m}">${m}</option>`).join('');
    const myName = CFG.allMembers.find(m => m.toLowerCase().includes(String(user.name||'').split(' ')[0].toLowerCase())) || CFG.allMembers[0] || '';
    byEl.value = myName;

    document.getElementById('meta-date').value = today();

    const urlP = new URLSearchParams(location.search).get('project');
    addBlock(urlP || undefined);
    // Pull any server-saved draft (survives across devices); keep whichever is newer
    try {
      const sv = await api('getPlanDraft');
      if (sv && sv.draft) {
        const local = localStorage.getItem(DRAFT_KEY);
        let localTs=0, svTs=0;
        try{ localTs=JSON.parse(local||'{}').ts||0; }catch(e){}
        try{ svTs=JSON.parse(sv.draft).ts||0; }catch(e){}
        if (!local || svTs > localTs) localStorage.setItem(DRAFT_KEY, sv.draft);
      }
    } catch(e){}
    maybeShowDraftBanner();
  } catch(e) {
    document.getElementById('submit-status').textContent = '✗ Failed to load form data: ' + e.message;
  }
};

function today(){ return new Date().toISOString().split('T')[0]; }

function isVisitType(s){ return /site visit|meeting|dper/i.test(s); }

// ── DRAFT AUTOSAVE — never lose a filled form on a failed submit ──
const DRAFT_KEY='ids_plan_draft';
let _draftT=null;
function planDraft(){
  const blocks=[];
  document.querySelectorAll('.block').forEach(b=>{
    const rows=[];
    b.querySelectorAll('.b-rows .trow').forEach(tr=>{
      rows.push({ stage:tr.querySelector('.r-stage')?.value||'', units:tr.querySelector('.r-units')?.value||'1',
        deadline:tr.querySelector('.r-deadline')?.value||'', desc:tr.querySelector('.r-desc')?.value||'' });
    });
    blocks.push({ project:b.querySelector('.b-project')?.value||'', member:b.querySelector('.b-member')?.value||'', rows });
  });
  return { ts:Date.now(), by:document.getElementById('meta-by')?.value||'', date:document.getElementById('meta-date')?.value||'', blocks };
}
function draftHasContent(d){ return !!(d && d.blocks && d.blocks.some(b=> b.project || (b.rows||[]).some(r=>r.stage||r.desc))); }
let _srvT=null;
function pushServerDraft(){ try{ const d=planDraft(); if(draftHasContent(d)) api('savePlanDraft',{draft:JSON.stringify(d)}); }catch(e){} }
function saveDraft(){
  try{ const d=planDraft(); if(draftHasContent(d)) localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }catch(e){}
  clearTimeout(_srvT); _srvT=setTimeout(pushServerDraft, 3000);   // also persist server-side (cross-device)
}
function saveDraftSoon(){ clearTimeout(_draftT); _draftT=setTimeout(saveDraft, 500); }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} const b=document.getElementById('draft-banner'); if(b) b.style.display='none'; try{ api('savePlanDraft',{draft:''}); }catch(e){} }
function discardDraft(){ clearDraft(); }
function restoreDraft(){
  let d; try{ d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }catch(e){}
  if(!d||!d.blocks){ clearDraft(); return; }
  const byEl=document.getElementById('meta-by');
  if(d.by && [...byEl.options].some(o=>o.value===d.by)) byEl.value=d.by;
  if(d.date) document.getElementById('meta-date').value=d.date;
  document.getElementById('blocks-container').innerHTML=''; blockCount=0;
  d.blocks.forEach(bd=>{
    addBlock();
    const block=document.getElementById('block-'+blockCount);
    if(bd.project){ const ps=block.querySelector('.b-project'); ps.value=bd.project; ps.dispatchEvent(new Event('change')); onBlockProject(block.id); }
    if(bd.member){ const ms=block.querySelector('.b-member'); ms.value=bd.member; ms.dispatchEvent(new Event('change')); }
    block.querySelectorAll('.b-rows .trow').forEach(r=>r.remove());   // drop the default empty row
    (bd.rows||[]).forEach(rd=>{
      addRow(block.id);
      const tr=block.querySelector('.b-rows .trow:last-child');
      if(rd.stage){ const ss=tr.querySelector('.r-stage'); ss.value=rd.stage; ss.dispatchEvent(new Event('change')); }
      tr.querySelector('.r-units').value=rd.units||'1';
      tr.querySelector('.r-deadline').value=rd.deadline||'';
      tr.querySelector('.r-desc').value=rd.desc||'';
      onRowStage(tr.querySelector('.r-stage'));
    });
    if(!(bd.rows||[]).length) addRow(block.id);
  });
  document.getElementById('draft-banner').style.display='none';
  updateCount();
}
function maybeShowDraftBanner(){
  let d; try{ d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }catch(e){}
  if(!draftHasContent(d)) return;
  const when=d.ts?new Date(d.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const n=d.blocks.reduce((a,b)=>a+(b.rows||[]).filter(r=>r.stage).length,0);
  document.getElementById('draft-banner-text').textContent='You have an unsaved task plan'+(when?' from '+when:'')+(n?` (${n} task${n!==1?'s':''})`:'')+'.';
  document.getElementById('draft-banner').style.display='flex';
}
document.addEventListener('input',  e=>{ if(e.target.closest('.block')||e.target.closest('.meta-row')) saveDraftSoon(); });
document.addEventListener('change', e=>{ if(e.target.closest('.block')||e.target.closest('.meta-row')) saveDraftSoon(); });

// ── BULK BLOCKS ──────────────────────────────────────────
function addBlock(preProject){
  blockCount++;
  const id = 'block-'+blockCount;
  const projOpts = CFG.projects.map(p=>`<option value="${p.name}" data-id="${p.id||''}" data-mult="${p.multiplier||1}">${p.name}</option>`).join('');
  const memOpts  = CFG.allMembers.map(m=>`<option value="${m}">${m}</option>`).join('');
  const div = document.createElement('div');
  div.className = 'block'; div.id = id;
  div.innerHTML = `
    <div class="block-head">
      <div class="block-head-fields">
        <select class="b-project" onchange="onBlockProject('${id}')">
          <option value="">Select project…</option>${projOpts}
        </select>
        <select class="b-member">
          <option value="">Assign to…</option>${memOpts}
        </select>
        <span class="b-mult-badge" style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);align-self:center"></span>
      </div>
      <button class="block-remove" onclick="removeBlock('${id}')">✕ Remove</button>
    </div>
    <div class="block-body">
      <div class="b-rows"></div>
      <button class="add-row-btn" onclick="addRow('${id}')">+ Add task</button>
    </div>`;
  document.getElementById('blocks-container').appendChild(div);
  if (preProject) { div.querySelector('.b-project').value = preProject; onBlockProject(id); }
  addRow(id);
}

function onBlockProject(blockId){
  const block = document.getElementById(blockId);
  const opt   = block.querySelector('.b-project').selectedOptions[0];
  const mult  = opt ? parseFloat(opt.dataset.mult||1) : 1;
  block.querySelector('.b-mult-badge').textContent = mult !== 1 ? 'mult ×'+mult : '';
  // Refresh pts in existing rows
  block.querySelectorAll('.b-rows .trow').forEach(r => refreshRowPts(r, mult));
  updateCount();
}

function removeBlock(id){ document.getElementById(id).remove(); updateCount(); }

function addRow(blockId){
  const block = document.getElementById(blockId);
  const stageOpts = CFG.stages.map(s=>`<option value="${s.label}" data-pts="${s.pts||0}">${s.label}</option>`).join('');
  const row = document.createElement('div');
  row.className = 'trow';
  row.innerHTML = `
    <div class="trow-top">
      <select class="r-stage" onchange="onRowStage(this)">${stageOpts}</select>
      <input type="number" class="r-units" value="1" min="1" onchange="onRowStage(this)" title="Units">
      <input type="date" class="r-deadline" oninput="updateCount()" title="Deadline">
      <span class="pts-badge r-pts">—</span>
      <button class="del-row" onclick="this.closest('.trow').remove();updateCount()">×</button>
    </div>
    <input type="text" class="r-desc" placeholder="Description — area · drawing name (e.g. Kitchen — Floor Plan v2)" oninput="updateCount()">`;
  block.querySelector('.b-rows').appendChild(row);
  // Trigger pts calc
  const projOpt = block.querySelector('.b-project').selectedOptions[0];
  const mult = projOpt ? parseFloat(projOpt.dataset.mult||1) : 1;
  refreshRowPts(row, mult);
  updateCount();
}

function onRowStage(el){
  const tr = el.closest('.trow'), block = tr.closest('.block');
  const projOpt = block.querySelector('.b-project').selectedOptions[0];
  const mult = projOpt ? parseFloat(projOpt.dataset.mult||1) : 1;
  refreshRowPts(tr, mult);
  updateCount();
}

function refreshRowPts(tr, mult){
  const stageOpt = tr.querySelector('.r-stage').selectedOptions[0];
  const basePts  = stageOpt ? parseFloat(stageOpt.dataset.pts||0) : 0;
  const units    = parseFloat(tr.querySelector('.r-units').value||1);
  const w        = Math.round(basePts * mult * units * 10) / 10;
  tr.querySelector('.r-pts').textContent = basePts ? w+'pts' : '—';
}

// ── COUNT UPDATE ──────────────────────────────────────────
function updateCount(){
  let n = 0;
  document.querySelectorAll('.b-rows .trow').forEach(()=>n++);
  document.getElementById('submit-count').textContent = n + ' task' + (n!==1?'s':'');
  saveDraftSoon();
}

// ── SUBMIT ──────────────────────────────────────────────
async function submit(){
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('submit-status');
  const assignedBy  = document.getElementById('meta-by').value;
  const dateAssigned = document.getElementById('meta-date').value;
  btn.disabled = true; status.textContent = 'Submitting…';

  try{
    const blocks = [];
    let valid = true, errs = [];
    document.querySelectorAll('.block').forEach(block => {
      const projOpt = block.querySelector('.b-project').selectedOptions[0];
      const member  = block.querySelector('.b-member').value;
      if (!projOpt||!projOpt.value){ errs.push('A block has no project selected'); valid=false; return; }
      if (!member){ errs.push('A block has no member selected'); valid=false; return; }
      const mult = parseFloat(projOpt.dataset.mult||1);
      const tasks = [];
      block.querySelectorAll('.b-rows .trow').forEach(tr => {
        const stageOpt = tr.querySelector('.r-stage').selectedOptions[0];
        if (!stageOpt||!stageOpt.value) return;
        tasks.push({
          taskType:    stageOpt.value,
          basePts:     parseFloat(stageOpt.dataset.pts||0),
          units:       parseFloat(tr.querySelector('.r-units').value||1),
          targetDate:  tr.querySelector('.r-deadline').value,
          description: tr.querySelector('.r-desc').value
        });
      });
      if (!tasks.length){ errs.push('Block "'+projOpt.value+'" has no tasks'); valid=false; return; }
      blocks.push({ projectId:projOpt.dataset.id||'', project:projOpt.value, assignedTo:member, multiplier:mult, tasks });
    });
    if (!valid) throw new Error(errs.join('; '));
    if (!blocks.length) throw new Error('Add at least one project block with tasks');
    const expected = blocks.reduce((n,b)=>n+b.tasks.length,0);
    const r = await api('bulkAssignTasks', { blocks, assignedBy, dateAssigned });
    const written = Number(r.written)||0;
    // Only clear the form if EVERY task was written. Any shortfall keeps the
    // form intact so nothing is silently lost and the user can re-submit.
    if ((r.status === 'ok' || r.status === 'partial') && written >= expected){
      status.textContent = '✓ '+written+' task'+(written!==1?'s':'')+' created';
      clearDraft();                                    // submitted safely — drop the saved draft
      document.getElementById('blocks-container').innerHTML = '';
      blockCount = 0;
      addBlock();
    } else if (r.status === 'ok' || r.status === 'partial'){
      status.textContent = '⚠ Only '+written+' of '+expected+' saved — form kept. Check the dashboard and re-add any missing tasks.'
        + (r.errors&&r.errors.length ? ' ('+r.errors[0]+')' : '');
    } else throw new Error(r.message||'Failed');
  } catch(e){
    status.textContent = '✗ '+e.message;
  }
  btn.disabled = false;
}

updateCount();
</script>
</body>
</html>
