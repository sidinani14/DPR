<h1>Site Visit / Meeting Log</h1>
<div class="sub">Ideaform Design Studio · replaces the Google Forms · sign in to begin.</div>
<div id="app"><div class="card">Sign in with your Ideaform account to load the form…</div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
let TEAM=[], PROJECTS=[], LOG_TYPE='Meeting', actCount=0, photoFiles=[];
const PHOTO_THUMBS={};   // fileId → dataUrl, so the review gallery can preview uploaded photos
const EXTRA_ATTENDEES=['Siddharth Inani'];   // directors not in the active TEAM list
const PURPOSE={
  Meeting:['Project requirement gathering','Design presentation/ feedback','Approvals and decision making','Project progress review','Issue resolution','Material or Vendor selection','Weekly or regular call','Other'],
  'Site Visit':['Measurement / Survey','Client meeting','Contractor coordination','Vendor coordination','Quality check','Progress review','Other']
};
const CATS=[['Client','Action plan — Client'],['IDS','Action plan — IDS team'],['Contractor','Action plan — Contractors'],['Other','Action plan — Other']];

window.idsOnAuth = async function(){
  try{
    const r = await fetch(API+'?action=getLists').then(x=>x.json());
    TEAM=r.team||[]; PROJECTS=r.projects||[];
  }catch(e){}
  // Resuming an existing log from the Logs Manager (?edit=<logId>) — e.g. a
  // Draft that was submitted but never finished, or any log that needs a
  // photo/text fix. Jumps straight to the review/edit screen instead of a
  // blank form. (2026-07-23)
  const editId = new URLSearchParams(location.search).get('edit');
  if (editId){
    document.getElementById('app').innerHTML = '<div class="card"><div class="sub">Loading log…</div></div>';
    try{
      const d = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getMeetingLogForEdit', logId:editId})}).then(x=>x.json());
      if (d.status==='ok'){
        REVIEW = {logId:d.logId, project:d.project, date:d.date, type:d.type,
          body:d.body||'', items:d.items||[], teamAttendees:d.teamAttendees||[],
          clientAttendees:d.clientAttendees||'', purpose:d.purpose||[],
          photoIds:d.photoIds||[], folderId:d.folderId||''};
        renderReview();
        return;
      }
      document.getElementById('app').innerHTML = `<div class="card"><h1 style="color:#C0392B">Could not load this log</h1><div class="sub">${esc(d.message||'Unknown error')}</div><a href="logs.html" style="color:#1F3A5F">← Back to Logs Manager</a></div>`;
      return;
    }catch(e){
      document.getElementById('app').innerHTML = `<div class="card"><h1 style="color:#C0392B">Network error</h1><a href="logs.html" style="color:#1F3A5F">← Back to Logs Manager</a></div>`;
      return;
    }
  }
  render();
};
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function projOpts(){return '<option value="">Select project…</option>'+PROJECTS.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');}
function teamOpts(){const me=(window.IDS_USER&&window.IDS_USER.name)||'';return TEAM.map(t=>`<option ${t===me?'selected':''}>${esc(t)}</option>`).join('');}
function attendeeList(){const seen={};return TEAM.concat(EXTRA_ATTENDEES).filter(t=>{const k=t.toLowerCase();if(seen[k])return false;seen[k]=1;return !!t;});}
// When Aman is logging (he records Siddharth's meetings), pre-tick Siddharth.
function isAmanUser(){ return String((window.IDS_USER&&window.IDS_USER.email)||'').toLowerCase()==='aman.raghuwanshi@ideaform.in'; }
function teamChecks(){return attendeeList().map(t=>{const pre=(isAmanUser()&&t==='Siddharth Inani')?' checked':'';return `<label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;margin:3px 8px 3px 0"><input type="checkbox" style="width:auto" class="ta" value="${esc(t)}"${pre}>${esc(t)}</label>`;}).join('');}

function render(){
  const today=new Date().toISOString().substring(0,10);
  document.getElementById('app').innerHTML=`
  <div class="card">
    <div class="ch"><div class="cn">1</div><div class="ct">Type & project</div></div>
    <div class="field"><div class="lbl">Log type</div>
      <div class="toggle"><div id="t-m" class="on" onclick="setType('Meeting')">Meeting</div><div id="t-s" onclick="setType('Site Visit')">Site Visit</div></div></div>
    <div class="field"><div class="lbl">Project</div><select class="proj-sel" id="project">${projOpts()}</select></div>
    <div class="row"><div class="field"><div class="lbl">Date</div><input type="date" id="date" value="${today}"></div>
      <div class="field"><div class="lbl">Time</div><input type="time" id="time"></div>
      <div class="field"><div class="lbl">Duration (hrs)</div><input type="number" id="duration" min="0" step="0.5" placeholder="e.g. 1.5"></div></div>
    <div class="field"><div class="lbl">Logged by</div><select id="loggedBy">${teamOpts()}</select></div>
  </div>

  <div class="card">
    <div class="ch"><div class="cn">2</div><div class="ct">Attendees</div></div>
    <div class="field"><div class="lbl">IDS team present</div><div>${teamChecks()}</div></div>
    <div class="field"><div class="lbl">Client / other attendees <span class="opt">names</span></div><input id="clientAttendees" placeholder="e.g. Mr. Aaveg Bhandari, Mrs. Avni Bhandari"></div>
    <div class="field"><div class="lbl">Purpose</div><div class="chips" id="purpose"></div></div>
  </div>

  <div class="card">
    <div class="ch"><div class="cn">3</div><div class="ct" id="body-title">Minutes of meeting</div></div>
    <div class="field"><div class="lbl" id="body-lbl">Write area-wise minutes (numbered)</div><textarea id="body" placeholder="1. ...&#10;2. ..." onkeydown="numKey(event)" onfocus="numFocus(event)"></textarea></div>
  </div>

  <div class="card">
    <div class="ch"><div class="cn">4</div><div class="ct">Action plans</div></div>
    <div class="sub" style="margin:-2px 0 10px">One action per line — they auto-number. Set "assign to" only when it's for a specific person.</div>
    ${CATS.map(c=>`<div style="margin-bottom:12px">
      <div class="lbl">${c[1]}</div>
      ${c[0]==='IDS'
        ? `<select id="own-${c[0]}" style="margin-bottom:6px"><option value="">— assign all to (optional) —</option>${TEAM.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`
        : `<input id="own-${c[0]}" placeholder="${c[0]==='Client'?'client name (optional)':c[0]+' / agency (optional)'}" style="margin-bottom:6px">`}
      <textarea class="act-ta" id="actt-${c[0]}" placeholder="1. ...&#10;2. ..." style="min-height:64px" onkeydown="numKey(event)" onfocus="numFocus(event)"></textarea>
    </div>`).join('')}
  </div>

  <div class="card site-only">
    <div class="ch"><div class="cn">5</div><div class="ct">Site photos & videos</div></div>
    <div class="field"><div class="lbl">Photos <span class="opt">added to the client report & Drive</span></div>
      <input type="file" id="photos" accept="image/*" multiple onchange="onPhotos(this)"><div class="ph-list" id="ph-list"></div></div>
    <div class="field"><div class="lbl">Video links <span class="opt">Drive/YouTube URLs, one per line</span></div><textarea id="videos" placeholder="https://drive.google.com/..."></textarea></div>
  </div>

  <div id="bar"><button id="go" onclick="submitLog()">Submit log</button><div class="msg" id="msg"></div></div>`;
  setType(LOG_TYPE);
}
function setType(t){
  LOG_TYPE=t; const app=document.getElementById('app');
  document.body.classList.toggle('is-site', t==='Site Visit');
  document.getElementById('t-m').classList.toggle('on',t==='Meeting');
  document.getElementById('t-s').classList.toggle('on',t==='Site Visit');
  document.getElementById('body-title').textContent = t==='Site Visit'?'Key observations / issues':'Minutes of meeting';
  document.getElementById('body-lbl').textContent = t==='Site Visit'?'Note observations & issues (numbered)':'Write area-wise minutes (numbered)';
  const pc=document.getElementById('purpose');
  pc.innerHTML=PURPOSE[t].map(p=>`<div class="chip" data-v="${esc(p)}" onclick="this.classList.toggle('on')">${esc(p)}</div>`).join('');
}
// Auto-number a textarea: hitting Enter inserts the next "N. " so points are
// never missed; focusing an empty box seeds "1. ".
function numKey(e){
  if(e.key!=='Enter'||e.shiftKey) return;
  e.preventDefault();
  const ta=e.target, pos=ta.selectionStart;
  const before=ta.value.slice(0,pos), after=ta.value.slice(pos);
  const ins='\n'+(before.split('\n').length+1)+'. ';
  ta.value=before+ins+after;
  const np=before.length+ins.length; ta.setSelectionRange(np,np);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function numFocus(e){ const ta=e.target; if(!ta.value.trim()){ ta.value='1. '; ta.setSelectionRange(3,3); } }
// Phone camera photos are routinely several MB — uncompressed, a handful of
// them embedded inline in the cumulative PDF report is enough to make Apps
// Script's HTML→PDF conversion fail outright. Downscale + re-encode as JPEG
// client-side before upload, so every photo that reaches Drive is already
// small enough to embed directly (2026-07-21).
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if (!file.type || file.type.indexOf('image/')!==0){ resolve(null); return; } // non-images (rare) pass through untouched
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if (w>maxDim || h>maxDim){
          if (w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve({dataUrl:canvas.toDataURL('image/jpeg',quality), mime:'image/jpeg'});
      };
      img.onerror=()=>resolve(null); // fall back to the original file if it won't decode
      img.src=e.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
async function onPhotos(input){
  for(const f of input.files){
    const compressed=await compressImage(f, 1600, 0.78);
    if (compressed){
      photoFiles.push({name:f.name, mime:compressed.mime, dataUrl:compressed.dataUrl});
    } else {
      const dataUrl=await new Promise(r=>{const rd=new FileReader(); rd.onload=e=>r(e.target.result); rd.readAsDataURL(f);});
      photoFiles.push({name:f.name, mime:f.type, dataUrl});
    }
    document.getElementById('ph-list').innerHTML=photoFiles.map(p=>`<span class="t">${esc(p.name)}</span>`).join('');
  }
  input.value='';
}
function collectActions(){
  const out={Client:[],IDS:[],Contractor:[],Other:[]};
  CATS.forEach(c=>{
    const cat=c[0], ta=document.getElementById('actt-'+cat); if(!ta) return;
    const defOwner=(document.getElementById('own-'+cat)||{}).value||'';
    ta.value.split('\n').map(l=>l.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean).forEach(line=>{
      let owner=defOwner, text=line;
      // "Name: task" → assign that line to a specific team member (IDS only)
      const mm=line.match(/^([^:]{2,40}):\s*(.+)$/);
      if(mm && cat==='IDS' && TEAM.some(t=>t.toLowerCase()===mm[1].trim().toLowerCase())){ owner=mm[1].trim(); text=mm[2].trim(); }
      out[cat].push({owner:owner, text:text, deadline:''});
    });
  });
  return out;
}
async function submitLog(){
  const project=document.getElementById('project').value;
  if(!project){ msg('Pick a project first.'); return; }
  const go=document.getElementById('go'); go.disabled=true;
  const date=document.getElementById('date').value;
  try{
    // upload photos one-by-one
    const photoIds=[]; let folderId=''; const failed=[];
    for(let i=0;i<photoFiles.length;i++){ msg('Uploading photo '+(i+1)+'/'+photoFiles.length+'…');
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'uploadMeetingPhoto',project,date,name:photoFiles[i].name,mime:photoFiles[i].mime,dataUrl:photoFiles[i].dataUrl})}).then(x=>x.json()).catch(()=>({}));
      if(r&&r.fileId){photoIds.push(r.fileId); folderId=r.folderId||folderId; PHOTO_THUMBS[r.fileId]=photoFiles[i].dataUrl;}
      else failed.push({name:photoFiles[i].name, msg:(r&&r.message)||''});
    }
    // Don't silently submit a photo-less log — surface upload failures.
    if(failed.length){
      const drive = /permission|Drive|createFolder|createFile/i.test(failed[0].msg||'');
      msg('⚠ '+failed.length+' of '+photoFiles.length+' photo(s) failed to upload'+(drive?' — Google Drive access is not authorised yet. Ask Siddharth to authorise Drive, then re-add the photos.':' — please try again.'));
      go.disabled=false; return;
    }
    msg('Cleaning up wording & saving…');
    const payload={action:'submitMeetingLog', type:LOG_TYPE, project, date,
      time:document.getElementById('time').value, loggedBy:document.getElementById('loggedBy').value,
      teamAttendees:[...document.querySelectorAll('.ta:checked')].map(c=>c.value),
      clientAttendees:document.getElementById('clientAttendees').value,
      purpose:[...document.querySelectorAll('#purpose .chip.on')].map(c=>c.dataset.v),
      body:document.getElementById('body').value, actions:collectActions(),
      duration:document.getElementById('duration').value, photoIds, folderId,
      videoLinks:(document.getElementById('videos')?document.getElementById('videos').value:'').split('\n').map(s=>s.trim()).filter(Boolean)};
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}).then(x=>x.json());
    if(res.status==='ok'){ showReview(res, payload); window.scrollTo(0,0); }
    else { msg('Error: '+(res.message||'failed')); go.disabled=false; }
  }catch(e){ msg('Network error — try again.'); go.disabled=false; }
}
let REVIEW=null;
const qattr=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function showReview(res, payload){
  REVIEW={logId:res.logId, project:payload.project, date:payload.date, type:payload.type,
    body:res.bodyPolished||'', items:(res.items||[]).map(it=>({id:it.id,cat:it.cat,owner:it.owner,text:it.text})),
    teamAttendees:payload.teamAttendees||[], clientAttendees:payload.clientAttendees||'',
    purpose:payload.purpose||[], photoIds:payload.photoIds||[], folderId:payload.folderId||''};
  renderReview();
}
function renderReview(){
  const itemsHtml=(REVIEW.items||[]).map(it=>`
    <div class="field"><div class="lbl" style="font-size:11px;color:#6E6E70">${esc(it.cat)}${it.owner?' · '+esc(it.owner):''}</div>
      <input type="text" id="rv-it-${it.id}" value="${qattr(it.text)}"></div>`).join('');
  const purposeHtml=(PURPOSE[REVIEW.type]||[]).map(p=>`<div class="chip ${REVIEW.purpose.includes(p)?'on':''}" data-v="${qattr(p)}" onclick="this.classList.toggle('on')">${esc(p)}</div>`).join('');
  const attHtml=attendeeList().map(t=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;margin:3px 8px 3px 0"><input type="checkbox" class="rv-ta" value="${qattr(t)}" ${REVIEW.teamAttendees.includes(t)?'checked':''} style="width:auto">${esc(t)}</label>`).join('');
  const photoBlock = photoGalleryHtml();
  document.getElementById('app').innerHTML=`
    <div class="card">
      <h1>Review &amp; edit before sharing</h1>
      <div class="sub">Edit anything below — purpose, attendees${REVIEW.type==='Site Visit'?', photos':''}, notes and actions — then generate the PDF for <b>${esc(REVIEW.project)}</b>.</div>
      <div class="field"><div class="lbl">Purpose</div><div class="chips" id="rv-purpose">${purposeHtml}</div></div>
      <div class="field"><div class="lbl">IDS team present</div><div>${attHtml}</div></div>
      <div class="field"><div class="lbl">Other attendees <span class="opt">clients etc.</span></div><input id="rv-clients" value="${qattr(REVIEW.clientAttendees)}"></div>
      <div class="field"><div class="lbl">${REVIEW.type==='Site Visit'?'Key observations / issues':'Minutes of meeting'}</div>
        <textarea id="rv-body" style="min-height:150px" onkeydown="numKey(event)" onfocus="numFocus(event)">${esc(REVIEW.body||'')}</textarea></div>
      ${itemsHtml?'<div class="lbl" style="margin:10px 0 2px">Action items</div>'+itemsHtml:''}
      ${photoBlock}
      <button id="genbtn" onclick="finalizeLog()" style="background:#1F3A5F;color:#fff;border:none;border-radius:8px;padding:12px 18px;font-size:14px;cursor:pointer;width:100%;margin-top:12px">Generate shareable PDF</button>
      <div id="msg" class="sub" style="margin-top:8px"></div>
    </div>`;
}
function captureReview(){
  (REVIEW.items||[]).forEach(it=>{ const el=document.getElementById('rv-it-'+it.id); if(el) it.text=el.value; });
  const b=document.getElementById('rv-body'); if(b) REVIEW.body=b.value;
  const pp=document.getElementById('rv-purpose'); if(pp) REVIEW.purpose=[...pp.querySelectorAll('.chip.on')].map(c=>c.dataset.v);
  if(document.querySelector('.rv-ta')) REVIEW.teamAttendees=[...document.querySelectorAll('.rv-ta:checked')].map(c=>c.value);
  const cl=document.getElementById('rv-clients'); if(cl) REVIEW.clientAttendees=cl.value;
}
// Thumbnail gallery for the review screen — each photo has an × to remove it.
// The remove button is a real 34px tap target (was 19px, in a 2px corner —
// too small to hit reliably on a phone, which is how these are usually
// submitted from a site visit) with a bit of thumbnail padding around it so
// a slightly-off tap still lands on the button, not the photo. (2026-07-23)
function photoGalleryHtml(){
  if(REVIEW.type!=='Site Visit') return '';
  const thumbs=(REVIEW.photoIds||[]).map((id,i)=>{
    const src=PHOTO_THUMBS[id];
    const inner = src ? `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`
                      : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:#6E6E70;border-radius:6px">Photo ${i+1}</div>`;
    return `<div style="position:relative;width:88px;height:88px;padding-top:6px;padding-right:6px">
      <div style="width:100%;height:100%;border-radius:6px;overflow:hidden;border:1px solid #E3E3E5;background:#F4F4F5">${inner}</div>
      <button type="button" title="Remove this photo" onclick="removeReviewPhoto('${qattr(id)}')" style="position:absolute;top:0;right:0;width:34px;height:34px;border:2px solid #fff;border-radius:50%;background:#C0392B;color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center">×</button></div>`;
  }).join('');
  return `<div class="field"><div class="lbl">Photos <span class="opt">tap × to remove · add more below</span></div>
    ${REVIEW.photoIds.length?`<div id="rv-thumbs" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px">${thumbs}</div>`:''}
    <input type="file" accept="image/*" multiple onchange="onReviewPhotos(this)">
    <div id="rv-ph" class="sub" style="margin-top:4px">${REVIEW.photoIds.length} photo(s) attached</div></div>`;
}
function removeReviewPhoto(id){
  captureReview();                                            // keep in-progress edits
  REVIEW.photoIds=(REVIEW.photoIds||[]).filter(x=>x!==id);
  renderReview();                                             // regenerating the PDF later omits it
}
async function onReviewPhotos(input){
  const ph=document.getElementById('rv-ph'); const failed=[];
  for(const f of input.files){
    if(ph) ph.textContent='Uploading…';
    const compressed=await compressImage(f, 1600, 0.78);
    const dataUrl=compressed ? compressed.dataUrl
      : await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);});
    const mime=compressed ? compressed.mime : f.type;
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'uploadMeetingPhoto',project:REVIEW.project,date:REVIEW.date,name:f.name,mime,dataUrl})}).then(x=>x.json()).catch(()=>({}));
    if(r&&r.fileId){ REVIEW.photoIds.push(r.fileId); REVIEW.folderId=r.folderId||REVIEW.folderId; PHOTO_THUMBS[r.fileId]=dataUrl; }
    else failed.push((r&&r.message)||'');
  }
  input.value='';
  captureReview(); renderReview();                            // repaint gallery with the new thumbnails
  if(failed.length){ const el=document.getElementById('rv-ph'); if(el){ const drive=/permission|Drive|createFolder|createFile/i.test(failed[0]); el.textContent='⚠ '+failed.length+' photo(s) failed'+(drive?' — Drive not authorised':', try again')+' · '+REVIEW.photoIds.length+' attached'; el.style.color='#C0392B'; } }
}
async function finalizeLog(){
  const gb=document.getElementById('genbtn'); gb.disabled=true; msg('Generating the report PDF…');
  captureReview();
  const items={}; (REVIEW.items||[]).forEach(it=>{ items[it.id]=it.text; });
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'finalizeMeetingLog',logId:REVIEW.logId,bodyPolished:REVIEW.body,items,teamAttendees:REVIEW.teamAttendees,clientAttendees:REVIEW.clientAttendees,purpose:REVIEW.purpose,photoIds:REVIEW.photoIds})}).then(x=>x.json());
    if(res.status==='ok'){
      const link=res.pdfError
        ? `<span style="color:#C0392B">⚠ ${esc(res.pdfError)}</span>`
        : (res.pdfUrl?`<a href="${res.pdfUrl}" target="_blank" style="color:#1F3A5F;font-weight:600">Open / share the PDF ↗</a>`:'PDF generated.');
      document.getElementById('app').innerHTML=`<div class="card"><h1 style="color:#2E7D32">✓ Report ready</h1>
        <div class="sub">The report for <b>${esc(REVIEW.project)}</b> is updated with this ${LOG_TYPE.toLowerCase()} at the front.<br><br>${link}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px">
          <button onclick="editLog()" style="background:#1F3A5F;color:#fff;border:none;border-radius:8px;padding:10px 15px;font-size:13px;cursor:pointer">Missed something? Edit &amp; regenerate</button>
          <button onclick="deleteLog()" style="background:#fff;color:#C0392B;border:1px solid #E2DFD8;border-radius:8px;padding:10px 15px;font-size:13px;cursor:pointer">Delete this log</button>
          <a href="meetlog.html" style="color:#6E6E70">Log another</a>
        </div>
        <div id="msg" class="sub" style="margin-top:8px"></div></div>`;
      window.scrollTo(0,0);
    } else { msg('Error: '+(res.message||'failed')); gb.disabled=false; }
  }catch(e){ msg('Network error — try again.'); gb.disabled=false; }
}
function editLog(){ renderReview(); window.scrollTo(0,0); }   // fix without re-filling the form
async function deleteLog(){
  if(!confirm('Delete this log and remove it from the report? You can log it again fresh.')) return;
  msg('Deleting…');
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'deleteMeetingLog',logId:REVIEW.logId})}).then(x=>x.json());
    if(res.status==='ok'){ document.getElementById('app').innerHTML=`<div class="card"><h1 style="color:#C0392B">Log deleted</h1><div class="sub">Removed from <b>${esc(REVIEW.project)}</b>'s report.<br><br><a href="meetlog.html" style="color:#1F3A5F;font-weight:600">Log it again →</a></div></div>`; window.scrollTo(0,0); }
    else { msg('Could not delete: '+(res.message||'failed')); }
  }catch(e){ msg('Network error.'); }
}
function msg(t){const m=document.getElementById('msg'); if(m) m.textContent=t;}
</script>
</body></html>
