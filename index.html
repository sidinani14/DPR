<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideaform Design Studio · Team Workspace</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--surface:#FFFFFF;--border:#E2DFD8;--border2:#CBC7BC;--ink:#1A1917;--ink2:#6B6860;--ink3:#9E9B94;--navy:#1F3A5F;--orange:#F2A03D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:30px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.logo{height:34px}
.logotext{font-size:22px;letter-spacing:5px;font-weight:700}
.logotext .a{color:#4D4D4F}.logotext .b{color:var(--orange)}
.who{font-size:12px;color:var(--ink2);text-align:right}
.who b{color:var(--ink)}
.who a{color:var(--ink3);text-decoration:none;border-bottom:1px dotted var(--border2);cursor:pointer}
.hello{font-size:15px;color:var(--ink2);margin:18px 0 4px}
.hello b{color:var(--navy)}
.grouptitle{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s}
.tile:hover{border-color:var(--navy);transform:translateY(-1px)}
.tile-ic{font-size:22px;line-height:1;flex-shrink:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px}
.tile-t{font-size:14px;font-weight:600;color:var(--navy)}
.tile-d{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.4}
.foot{margin-top:34px;font-size:10.5px;color:var(--ink3);text-align:center}
</style></head><body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="ideaform-logo.png" alt="Ideaform Design Studio"
         onerror="this.outerHTML='<div class=&quot;logotext&quot;><span class=&quot;a&quot;>IDEA</span><span class=&quot;b&quot;>FORM</span></div>'">
    <div class="who" id="who"></div>
  </div>
  <div class="hello" id="hello">Team Workspace</div>
  <div id="tiles"></div>
  <div class="foot">Ideaform Design Studio · Internal team workspace · Confidential</div>
</div>

<script>
const ADMIN_EMAILS=['siddharth@ideaform.in','sidinani14@gmail.com','astha@ideaform.in','astha.uch@gmail.com',
  'achal.rathore@ideaform.in','himanshu.malviya@ideaform.in','bhavesh.bhagwat@ideaform.in'];
// Approvals + Weekly Report are restricted to Siddharth & Astha only.
const MANAGER_EMAILS=['siddharth@ideaform.in','sidinani14@gmail.com','astha@ideaform.in','astha.uch@gmail.com'];
const TOOLS=[
  {t:'Daily Progress Report', d:"Today's tasks, hours & deliverables", u:'dpr.html', i:'📝', g:'forms'},
  {t:'Meeting / Site Visit Log', d:'Log meetings & visits → client PDF', u:'meetlog.html', i:'🧾', g:'forms'},
  {t:'Site Execution — DPER', d:'Daily site execution report', u:'DPER.html', i:'🏗️', g:'forms'},
  {t:'CRM', d:'Client connections, leads & billing', u:'CRM.html', i:'🤝', g:'forms'},
  {t:'Task Dashboard', d:'All tasks, status & workload', u:'dashboard.html', i:'📊', g:'tools'},
  {t:'Projects Health', d:'Per-project status & activity', u:'projects.html', i:'🏢', g:'tools'},
  {t:'Plan Tasks', d:'Bulk assign tasks for the week', u:'dashboard.html?plan=1', i:'📋', g:'tools'},
  {t:'3M Message', d:'Monday morning message generator', u:'3m.html', i:'📨', g:'tools'},
  {t:'Leads', d:'Lead pipeline & analytics', u:'leads.html', i:'🎯', g:'tools'},
  {t:'Approvals', d:'Tasks, blocks & billing requests', u:'approval.html', i:'✅', g:'manager'},
  {t:'Weekly Report', d:'Team performance scorecards', u:'weeklyreport.html', i:'📈', g:'manager'},
  {t:'Project Digest', d:'Weekly per-project activity (PDF)', u:'weeklydigest.html', i:'📑', g:'manager'},
  {t:'Logs Manager', d:'Review & delete stale/repeat logs', u:'logs.html', i:'🗂️', g:'manager'},
];
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;')}
function tileHtml(x){return `<a class="tile" href="${x.u}"><div class="tile-ic">${x.i}</div><div><div class="tile-t">${esc(x.t)}</div><div class="tile-d">${esc(x.d)}</div></div></a>`}
function switchAccount(){ if(window.IDS_SIGNOUT) window.IDS_SIGNOUT(); else { try{localStorage.removeItem('ids_token');google.accounts.id.disableAutoSelect();}catch(e){} location.reload(); } }
window.idsOnAuth = function(user){
  const email=String((user&&user.email)||'').toLowerCase();
  const first=String((user&&user.name)||'').split(' ')[0]||'there';
  const isMgr=MANAGER_EMAILS.includes(email);   // Approvals + Weekly Report only
  document.getElementById('who').innerHTML=`<b>${esc(user.name||email)}</b><br><a onclick="switchAccount()">not you? switch</a>`;
  document.getElementById('hello').innerHTML=`Hi <b>${esc(first)}</b> — pick a tool to get started.`;
  const forms=TOOLS.filter(x=>x.g==='forms').map(tileHtml).join('');
  const tools=TOOLS.filter(x=>x.g==='tools' || (x.g==='manager'&&isMgr)).map(tileHtml).join('');
  let html=`<div class="grouptitle">Daily forms</div><div class="grid">${forms}</div>`;
  if(tools) html+=`<div class="grouptitle">Dashboards &amp; tools</div><div class="grid">${tools}</div>`;
  document.getElementById('tiles').innerHTML=html;
};
</script>
</body></html>
