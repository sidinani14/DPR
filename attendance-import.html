<style>

<div id="gate" style="max-width:430px;margin:16vh auto;text-align:center;color:var(--t2);padding:20px">

<div id="app" class="wrap" style="display:none">
  <div class="rh"><h1>Attendance Import</h1><div class="sub">Upload the Paytime "Working Duration Report" export — punch data only, status letters are ignored</div></div>

  <section>
    <h2>1 · Upload</h2>
    <div class="h2sub">.xls / .xlsx from Paytime — weekly or monthly export, either works</div>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xls,.xlsx">
      <div class="ic">📄</div>
      <div class="t">Click to choose the Paytime export, or drop it here</div>
      <div class="t2">Only First In / Last Out / Total Hrs are read — Status letters (P/A/HD…) are ignored per instruction</div>
    </label>
    <div id="parse-msg" style="margin-top:12px"></div>
  </section>

  <div id="preview"></div>
</div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
const MANAGER_EMAILS=['siddharth@ideaform.in','sidinani14@gmail.com','astha@ideaform.in','astha.uch@gmail.com'];
let ROSTER=[];          // team member names from getLists
let PARSED=null;        // {year, month, members:[{name,firstIn,lastOut,totalHrs}]}
let ROWS=[];            // flattened, editable rows for the preview/import
let HOLIDAYS=[];        // 'YYYY-MM-DD' — shared company holiday list for the parsed month
let APPROVED_LEAVES={}; // member name -> number, manual (tied to Siddharth's own leave ledger)

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MONTHS={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
const MON_NAME=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parsePaytimeDate(s){
  const m=String(s||'').match(/(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
  if(!m) return null;
  const mo=MONTHS[m[2]]; if(!mo) return null;
  return {day:+m[1], month:mo, year:+m[3]};
}
function toMin(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})/); if(!m) return null; const v=+m[1]*60+ +m[2]; return v||null; }

// The Paytime "Working Duration Report" layout, verified against three real
// exports (June full-month, two July snapshots): row label in col A, one
// blank spacer column, then one column per calendar day of the month in
// order — so day D's value sits at column index D+1 (0-indexed). This holds
// regardless of the header's own day-number row, which is not reliable to
// auto-detect from. Employee name is the last populated cell in the
// "Emp ID :" row (usually column index 6).
function parsePaytimeWorkbook(wb){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  let year=null, month=null;
  for(const r of rows){
    if(String(r[0]||'').trim().replace(/:$/,'')==='From'){
      const d=parsePaytimeDate(r[1]); if(d){ year=d.year; month=d.month; } break;
    }
  }
  if(!year) throw new Error("Could not find the report's date range (a 'From:' row) — is this a Paytime Working Duration Report export?");

  const members=[]; let cur=null;
  for(let i=0;i<rows.length;i++){
    const c0=String(rows[i][0]||'').trim();
    if(c0==='Emp ID :'){
      let name=String(rows[i][6]||'').trim();
      if(!name){ for(let c=rows[i].length-1;c>=1;c--){ if(String(rows[i][c]||'').trim()){ name=String(rows[i][c]).trim(); break; } } }
      cur={name, firstIn:{}, lastOut:{}, totalHrs:{}};
      members.push(cur);
      continue;
    }
    if(!cur) continue;
    if(c0==='First In')  for(let d=1;d<=31;d++) cur.firstIn[d]=String(rows[i][d+1]||'').trim();
    if(c0==='Last Out')  for(let d=1;d<=31;d++) cur.lastOut[d]=String(rows[i][d+1]||'').trim();
    if(c0==='Total Hrs') for(let d=1;d<=31;d++) cur.totalHrs[d]=String(rows[i][d+1]||'').trim();
  }
  if(!members.length) throw new Error("No employee blocks found ('Emp ID :' rows) — check this is the right export.");
  return {year, month, members};
}

function bestMatch(rawName){
  const rn=rawName.toLowerCase().replace(/\s+/g,' ').trim();
  let hit=ROSTER.find(m=>m.toLowerCase()===rn);
  if(hit) return hit;
  const firstTok=rn.split(' ')[0];
  hit=ROSTER.find(m=>m.toLowerCase().split(' ')[0]===firstTok);
  return hit||null;
}

function toHrsFromHHMM(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})/); if(!m) return 0; return +m[1]+ +m[2]/60; }

// ── Classification: on-time / late (09:10, Achal 10:40) · half-day (<6h) ·
// undertime/overtime — day-unit formula: shortfall or excess minutes /60/8
// (e.g. 15 min short of 8h = 15/60/8 = 0.03125). A late day with no explicit
// Approve becomes Absent — zero hours, zero UT/OT, full-day deduction. ──
function lateThreshold(member){ return member==='Achal Rathore' ? 640 : 550; }  // 10:40 / 09:10 in minutes
function isHoliday(date){ return HOLIDAYS.indexOf(date) > -1; }
// row.finalHrs always holds the actual worked hours (bio+field, editable) —
// it is NEVER zeroed here, so toggling Approve/Deny back and forth never
// loses data. An Absent day's hours are zeroed only at export time
// (exportRow below), for the payroll record — the review table keeps
// showing what they actually worked so Siddharth can see what he's denying.
// A Holiday takes priority over everything else, matching the live payroll
// spreadsheet: no late/absent check, no undertime — but overtime still
// applies if someone worked a holiday (verified against its formula).
function recompute(row){
  const totalMin=(parseFloat(row.finalHrs)||0)*60;
  if(isHoliday(row.date)){
    row.status='Holiday'; row.late=false; row.undertime=0;
    row.overtime = totalMin>480 ? Math.round(((totalMin-480)/60/8)*100000)/100000 : 0;
    return;
  }
  // No punch at all and no field-work hours -> a genuine no-show, not a
  // late-arrival case (which needs a firstIn to check against the threshold).
  // Paytime represents "no punch" as the literal string "00:00", not an
  // empty string — toMin('00:00') is 0, so check the PARSED minute value
  // (null or 0), not row.firstIn's truthiness, or a "00:00" row silently
  // falls through to the Half-day/Present branch below instead of Absent.
  const inMinCheck = toMin(row.firstIn);
  if ((inMinCheck==null || inMinCheck===0) && totalMin<=0){
    row.status='Absent'; row.late=false; row.undertime=0; row.overtime=0;
    return;
  }
  const thr=lateThreshold(row.member);
  const inMin=toMin(row.firstIn);
  row.late = inMin!=null && inMin>thr && inMin<720;
  if(row.late && row.lateApproved!==true){
    row.status='Absent'; row.undertime=0; row.overtime=0;
    return;
  }
  row.status = (parseFloat(row.finalHrs)||0) < 6 ? 'Half-day' : 'Present';
  if(totalMin < 480){ row.undertime=Math.round(((480-totalMin)/60/8)*100000)/100000; row.overtime=0; }
  else               { row.overtime=Math.round(((totalMin-480)/60/8)*100000)/100000; row.undertime=0; }
}
// The hours/UT/OT actually sent to the backend / used in the salary-day math
// — an Absent day contributes nothing, regardless of hours worked that day.
function exportRow(row){
  const absent = row.status==='Absent';
  return {date:row.date, member:row.member, firstIn:row.firstIn, lastOut:row.lastOut,
    totalHrs: absent?0:row.finalHrs, status:row.status, late:row.late, lateApproved:row.lateApproved===true,
    undertime: absent?0:row.undertime, overtime: absent?0:row.overtime,
    fieldHours: absent?0:row.fieldHrs};
}
function recomputeFinalHrs(row){ row.finalHrs = Math.round(((parseFloat(row.bioHrs)||0)+(parseFloat(row.fieldHrs)||0))*100)/100; recompute(row); }

function buildRows(parsed){
  const out=[];
  const daysInMonth=new Date(parsed.year, parsed.month, 0).getDate();
  parsed.members.forEach(m=>{
    const matched=bestMatch(m.name);
    for(let d=1; d<=daysInMonth; d++){
      const fi=m.firstIn[d]||'', lo=m.lastOut[d]||'', th=m.totalHrs[d]||'';
      const inMin=toMin(fi), hrs=toHrsFromHHMM(th)||parseFloat(th)||0;
      const isSunday = new Date(parsed.year, parsed.month-1, d).getDay()===0;
      // Skip an empty Sunday (non-working day, no punch) so the table isn't
      // cluttered with 4-5 "Absent" Sundays a month — keep it if someone
      // genuinely punched in on a Sunday. Every other day always gets a row,
      // even with no punch, so real absences are visible and reviewable
      // (previously such days were silently dropped from the table entirely).
      if (isSunday && (inMin==null || !hrs)) continue;
      const date=parsed.year+'-'+String(parsed.month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const row={date, rawName:m.name, member:matched||m.name, matched:!!matched, include:true,
        firstIn:fi, lastOut:lo, bioHrs:Math.round(hrs*100)/100, fieldHrs:0, fieldEntries:[], finalHrs:Math.round(hrs*100)/100,
        late:false, lateApproved:null, status:'Present', undertime:0, overtime:0, lateContext:null};
      recompute(row);
      out.push(row);
    }
  });
  return out;
}

// Merge in LATE_REQUESTS context (pre-check Approve when they said they told
// us in advance) and FIELD_WORK hours (added on top of biometric — a site
// visit's travel time rarely shows in the punch clock). A field-work entry
// with no matching biometric row becomes its own field-only day.
function mergeContext(rows, lateReqs, fieldWork){
  const byKey=k=>rows.find(r=>r.member.toLowerCase()===k[0]&&r.date===k[1]);
  lateReqs.forEach(lr=>{
    const row=rows.find(r=>r.member.toLowerCase()===lr.member.toLowerCase() && r.date===lr.date);
    if(row){ row.lateContext={informedBefore9:lr.informedBefore9, reportedPunchIn:lr.reportedPunchIn, reason:lr.reason};
      if(row.late && lr.informedBefore9==='Yes') row.lateApproved=true;   // pre-check suggestion, still overridable
      recompute(row);
    }
  });
  const byMemberDate={};
  fieldWork.forEach(f=>{ const k=f.member.toLowerCase()+'|'+f.date; (byMemberDate[k]=byMemberDate[k]||[]).push(f); });
  Object.keys(byMemberDate).forEach(k=>{
    const [mem,date]=k.split('|');
    const entries=byMemberDate[k];
    const sum=Math.round(entries.reduce((s,e)=>s+(e.hours||0),0)*100)/100;
    let row=rows.find(r=>r.member.toLowerCase()===mem && r.date===date);
    if(!row){
      const matched=ROSTER.find(m=>m.toLowerCase()===mem);
      row={date, rawName:entries[0].member, member:matched||entries[0].member, matched:!!matched, include:true,
        firstIn:'', lastOut:'', bioHrs:0, fieldHrs:0, fieldEntries:[], finalHrs:0,
        late:false, lateApproved:null, status:'Present', undertime:0, overtime:0, lateContext:null};
      rows.push(row);
    }
    row.fieldHrs=sum; row.fieldEntries=entries;
    recomputeFinalHrs(row);
  });
  rows.sort((a,b)=> a.member.localeCompare(b.member) || a.date.localeCompare(b.date));
}

function handleFile(file){
  const msg=document.getElementById('parse-msg');
  msg.innerHTML='<div class="loading">Reading file…</div>';
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      PARSED=parsePaytimeWorkbook(wb);
      ROWS=buildRows(PARSED);
      const daysInMonth=new Date(PARSED.year, PARSED.month, 0).getDate();
      const from=PARSED.year+'-'+String(PARSED.month).padStart(2,'0')+'-01';
      const to=PARSED.year+'-'+String(PARSED.month).padStart(2,'0')+'-'+String(daysInMonth).padStart(2,'0');
      msg.innerHTML=`<div class="loading">Parsed ${MON_NAME[PARSED.month]} ${PARSED.year} — ${PARSED.members.length} employees. Loading late-arrival, field-work, holiday &amp; leave context…</div>`;
      const monthKey=PARSED.year+'-'+String(PARSED.month).padStart(2,'0');
      let lateReqs=[], fieldWork=[], holidayDates=[], adjustments=[];
      try{ lateReqs=(await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getLateRequests', from, to})}).then(r=>r.json())).requests||[]; }catch(e2){}
      try{ fieldWork=(await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getFieldWorkForRange', from, to})}).then(r=>r.json())).entries||[]; }catch(e2){}
      try{ holidayDates=(await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getHolidays', from, to})}).then(r=>r.json())).dates||[]; }catch(e2){}
      try{ adjustments=(await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getMonthlyAdjustments', month:monthKey})}).then(r=>r.json())).adjustments||[]; }catch(e2){}
      HOLIDAYS=holidayDates.slice();
      APPROVED_LEAVES={}; adjustments.forEach(a=>{ APPROVED_LEAVES[a.member]=a.approvedLeaves; });
      mergeContext(ROWS, lateReqs, fieldWork);
      ROWS.forEach(recompute);   // re-classify now that HOLIDAYS is loaded
      msg.innerHTML=`<div class="banner ok">Parsed ${MON_NAME[PARSED.month]} ${PARSED.year} — ${PARSED.members.length} employees, ${ROWS.length} days found (incl. field-only days).</div>`;
      renderPreview();
    }catch(err){
      msg.innerHTML='<div class="banner bad">'+esc(err.message)+'</div>';
      document.getElementById('preview').innerHTML='';
    }
  };
  reader.readAsArrayBuffer(file);
}

const STATUS_COLOR={Present:'var(--green)', 'Half-day':'var(--amber)', Absent:'var(--red)', Holiday:'#8B7CF6'};
// Exact formula from the live payroll spreadsheet (verified byte-for-byte
// against real month-end totals for two employees):
//   Total Working Days = ROUND((PresentDays + NetOT) × 2) / 2
//   Absentism = MAX(0, CalendarDays − Sundays − Holidays − ApprovedLeaves − TotalWorkingDays)
//   Total Salary Days = ROUND((CalendarDays − Absentism) × 2) / 2
// PresentDays excludes both Absent AND Holiday rows (a holiday is paid time
// off, not a day "present" — matches COUNTIF(Full Day)+COUNTIF(Overtime)+
// COUNTIF(Half Day), none of which include the Holiday status bucket).
function memberSummary(rows, member){
  const present=rows.filter(r=>r.status!=='Absent' && r.status!=='Holiday');
  const half=rows.filter(r=>r.status==='Half-day');
  const absent=rows.filter(r=>r.status==='Absent');
  const holiday=rows.filter(r=>r.status==='Holiday');
  const totalUT=Math.round(rows.reduce((s,r)=>s+r.undertime,0)*10000)/10000;
  const totalOT=Math.round(rows.reduce((s,r)=>s+r.overtime,0)*10000)/10000;
  const netOT=Math.round((totalOT-totalUT)*10000)/10000;
  const totalWorkingDays=Math.round((present.length+netOT)*2)/2;

  const daysInMonth=PARSED ? new Date(PARSED.year, PARSED.month, 0).getDate() : 0;
  let sundayCount=0;
  if(PARSED) for(let d=1; d<=daysInMonth; d++){ if(new Date(PARSED.year, PARSED.month-1, d).getDay()===0) sundayCount++; }
  const monthPrefix=PARSED ? (PARSED.year+'-'+String(PARSED.month).padStart(2,'0')) : '';
  const holidaysInMonth=HOLIDAYS.filter(d=>d.startsWith(monthPrefix)).length;
  const approvedLeaves=parseFloat(APPROVED_LEAVES[member])||0;
  const absentism=Math.max(0, daysInMonth - sundayCount - holidaysInMonth - approvedLeaves - totalWorkingDays);
  const salaryDays=Math.round((daysInMonth-absentism)*2)/2;

  return {present:present.length, half:half.length, absent:absent.length, holiday:holiday.length,
    totalUT, totalOT, netOT, totalWorkingDays, daysInMonth, sundayCount, holidaysInMonth, approvedLeaves,
    absentism:Math.round(absentism*100)/100, salaryDays};
}

function renderPreview(){
  const host=document.getElementById('preview');
  if(!ROWS.length){ host.innerHTML=''; return; }

  const byDate={}; ROWS.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  const suspectDates=Object.keys(byDate).filter(d=> byDate[d].every(r=>r.finalHrs<=0.05 && r.status==='Absent'));
  const unmatched=[...new Set(ROWS.filter(r=>!r.matched).map(r=>r.rawName))];
  const undecidedLate=ROWS.filter(r=>r.late && r.lateApproved!==true && r.lateApproved!==false).length;

  let banners='';
  if(unmatched.length) banners+=`<div class="banner warn">${unmatched.length} name(s) from the file did not match anyone on the team roster — pick the right person for each row below, or untick to skip: <b>${unmatched.map(esc).join(', ')}</b></div>`;
  if(suspectDates.length) banners+=`<div class="banner bad">${suspectDates.length} date(s) show <b>zero hours for everyone</b> (${suspectDates.slice(0,5).join(', ')}${suspectDates.length>5?'…':''}) — likely a weekend/holiday, but double-check if you expected people in.</div>`;
  if(undecidedLate) banners+=`<div class="banner warn">${undecidedLate} late arrival(s) still <b>undecided</b> — they will import as <b>Absent</b> unless you click Approve. Suggestions are pre-checked where someone said they informed you in advance; review every one.</div>`;

  const monthPrefix=PARSED ? (PARSED.year+'-'+String(PARSED.month).padStart(2,'0')) : '';
  const holidaysThisMonth=HOLIDAYS.filter(d=>d.startsWith(monthPrefix)).sort();
  const holidaysHtml=`<section style="margin-bottom:14px">
    <h2>Holidays this month</h2>
    <div class="h2sub">Shared company holiday list for ${MON_NAME[PARSED.month]} ${PARSED.year} — a holiday day is excluded from late/absent/undertime for everyone (matches the payroll sheet)</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:${holidaysThisMonth.length?'10px':'0'}">
      <input type="date" id="holiday-date-input" min="${monthPrefix}-01" max="${monthPrefix}-31" style="background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px">
      <button class="btn2" onclick="addHoliday()">+ Add holiday</button>
    </div>
    ${holidaysThisMonth.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${holidaysThisMonth.map(d=>`<span style="font-size:11px;background:rgba(139,124,246,.15);color:#8B7CF6;padding:3px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:6px">${esc(d)}<span onclick="removeHoliday('${esc(d)}')" style="cursor:pointer;font-weight:700">×</span></span>`).join('')}</div>`:''}
  </section>`;

  const included=ROWS.filter(r=>r.include).length;
  const byMember={}; ROWS.forEach(r=>{ (byMember[r.member]=byMember[r.member]||[]).push(r); });
  const memberBlocks=Object.keys(byMember).sort().map(mem=>{
    const rows=byMember[mem], sum=memberSummary(rows, mem);
    const rowsHtml=rows.map(r=>{
      const i=ROWS.indexOf(r);
      const lateBadge = r.late ? `<span style="font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(234,67,53,.15);color:var(--red)">LATE</span>` : '';
      const ctx = r.lateContext ? `<div style="font-size:10px;color:var(--t3);margin-top:2px">informed before 9: <b>${esc(r.lateContext.informedBefore9)}</b>${r.lateContext.reportedPunchIn?' · said '+esc(r.lateContext.reportedPunchIn):''}${r.lateContext.reason?' · "'+esc(r.lateContext.reason)+'"':''}</div>` : '';
      const decide = r.late ? `<div style="display:flex;gap:4px;margin-top:4px">
          <button onclick="ROWS[${i}].lateApproved=true;recompute(ROWS[${i}]);renderPreview()" style="font-size:9.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--green);background:${r.lateApproved===true?'var(--green)':'transparent'};color:${r.lateApproved===true?'#0F1923':'var(--green)'};cursor:pointer;font-weight:700">Approve</button>
          <button onclick="ROWS[${i}].lateApproved=false;recompute(ROWS[${i}]);renderPreview()" style="font-size:9.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--red);background:${r.lateApproved===false?'var(--red)':'transparent'};color:${r.lateApproved===false?'#fff':'var(--red)'};cursor:pointer;font-weight:700">Deny → Absent</button>
        </div>` : '';
      const fieldDetail = r.fieldEntries.length ? `<div style="font-size:10px;color:var(--t3);margin-top:2px">${r.fieldEntries.map(f=>esc(f.type)+' '+esc(f.project)+' '+esc(f.start)+'–'+esc(f.end)).join('<br>')}</div>` : '';
      return `<tr>
        <td class="n"><input type="checkbox" ${r.include?'checked':''} onchange="ROWS[${i}].include=this.checked;updateCount()"></td>
        <td>${esc(r.date)} ${lateBadge}${ctx}${decide}</td>
        <td class="n"><input type="time" value="${esc(r.firstIn)}" onchange="ROWS[${i}].firstIn=this.value;recompute(ROWS[${i}]);renderPreview()" style="width:88px;font-size:11px;background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:4px;padding:2px 4px"></td>
        <td class="n"><input type="time" value="${esc(r.lastOut)}" onchange="ROWS[${i}].lastOut=this.value;renderPreview()" style="width:88px;font-size:11px;background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:4px;padding:2px 4px"></td>
        <td class="n"><input type="number" step="0.01" value="${r.bioHrs}" onchange="ROWS[${i}].bioHrs=parseFloat(this.value)||0;recomputeFinalHrs(ROWS[${i}]);renderPreview()" style="width:60px;font-size:11px;background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:4px;padding:2px 4px"></td>
        <td class="n">${r.fieldHrs>0?('+'+r.fieldHrs.toFixed(2)):'—'}${fieldDetail}</td>
        <td class="n"><input type="number" step="0.01" value="${r.finalHrs}" onchange="ROWS[${i}].finalHrs=parseFloat(this.value)||0;recompute(ROWS[${i}]);renderPreview()" style="width:60px;font-size:11px;font-weight:700;background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:4px;padding:2px 4px"></td>
        <td class="n"><span style="font-size:10.5px;font-weight:700;color:${STATUS_COLOR[r.status]}">${r.status}</span></td>
        <td class="n" style="font-size:10.5px">${r.undertime?('−'+r.undertime.toFixed(4)):(r.overtime?('+'+r.overtime.toFixed(4)):'—')}</td>
      </tr>`;
    }).join('');
    return `<div style="border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden">
      <div style="padding:10px 14px;background:rgba(255,255,255,.03);display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <b style="font-size:13px">${esc(mem)}</b>
        <span style="font-size:11px;color:var(--t2)">Present ${sum.present}</span>
        <span style="font-size:11px;color:var(--amber)">Half-day ${sum.half}</span>
        <span style="font-size:11px;color:var(--red)">Absent ${sum.absent}</span>
        <span style="font-size:11px;color:#8B7CF6">Holiday ${sum.holiday}</span>
        <span style="font-size:11px;color:var(--t2)">UT ${sum.totalUT.toFixed(4)} · OT ${sum.totalOT.toFixed(4)}</span>
        <span style="font-size:11px;font-weight:700;color:${sum.netOT<0?'var(--red)':'var(--green)'}">Net ${sum.netOT>=0?'+':''}${sum.netOT.toFixed(4)}</span>
        <span style="font-size:11px;font-weight:700">Working days: ${sum.totalWorkingDays.toFixed(2)}</span>
        <label style="font-size:11px;color:var(--t2);display:flex;align-items:center;gap:5px">Approved leaves
          <input type="number" step="0.5" value="${sum.approvedLeaves}" onchange="APPROVED_LEAVES['${esc(mem).replace(/'/g,"\\'")}']=parseFloat(this.value)||0;renderPreview()" style="width:48px;font-size:11px;background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:4px;padding:2px 4px">
        </label>
        <span style="font-size:11px;color:var(--t2)">Absentism: ${sum.absentism.toFixed(2)}</span>
        <span style="font-size:11px;font-weight:700;margin-left:auto">Salary days: ${sum.salaryDays.toFixed(2)}</span>
      </div>
      <div class="tblwrap" style="border:none;border-radius:0;max-height:none">
        <table><thead><tr><th class="n">✓</th><th>Date</th><th class="n">First In</th><th class="n">Last Out</th><th class="n">Bio Hrs</th><th class="n">Field</th><th class="n">Final Hrs</th><th class="n">Status</th><th class="n">UT/OT</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>
    </div>`;
  }).join('');

  host.innerHTML=`${holidaysHtml}
  <section>
    <h2>2 · Review before import</h2>
    <div class="h2sub">Edit any punch/hours, decide every late arrival, then import. Nothing is written until you click Import.</div>
    ${banners}
    ${memberBlocks}
    <div class="row-actions">
      <button class="btn" id="import-btn" onclick="doImport()">Import <span id="import-count">${included}</span> rows</button>
      <button class="btn2" onclick="toggleAll(true)">Select all</button>
      <button class="btn2" onclick="toggleAll(false)">Deselect all</button>
      <span class="stat" id="import-status"></span>
    </div>
  </section>`;
}
function addHoliday(){
  const input=document.getElementById('holiday-date-input');
  const d=input.value;
  if(!d) return;
  if(HOLIDAYS.indexOf(d)===-1){ HOLIDAYS.push(d); HOLIDAYS.sort(); }
  input.value='';
  ROWS.forEach(recompute);
  renderPreview();
}
function removeHoliday(d){
  HOLIDAYS=HOLIDAYS.filter(x=>x!==d);
  ROWS.forEach(recompute);
  renderPreview();
}
function updateCount(){ document.getElementById('import-count').textContent=ROWS.filter(r=>r.include).length; }
function toggleAll(v){ ROWS.forEach(r=>r.include=v); renderPreview(); }

async function doImport(){
  const btn=document.getElementById('import-btn'); const status=document.getElementById('import-status');
  const rows=ROWS.filter(r=>r.include && r.matched).map(exportRow);
  if(!rows.length){ status.textContent='Nothing selected to import.'; return; }
  const monthKey=PARSED.year+'-'+String(PARSED.month).padStart(2,'0');
  const adjustments=Object.keys(APPROVED_LEAVES).map(m=>({member:m, approvedLeaves:parseFloat(APPROVED_LEAVES[m])||0}));
  btn.disabled=true; status.textContent='Importing…';
  try{
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'importAttendance', rows})}).then(r=>r.json());
    try{ await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveHolidays', dates:HOLIDAYS})}); }catch(e2){}
    try{ await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveMonthlyAdjustments', month:monthKey, adjustments})}); }catch(e2){}
    if(res.status==='ok') status.innerHTML=`<span style="color:var(--green);font-weight:700">✓ Imported — ${res.appended} new, ${res.updated} updated.</span>`;
    else status.innerHTML='<span style="color:var(--red)">'+esc(res.message||'Import failed')+'</span>';
  }catch(e){ status.innerHTML='<span style="color:var(--red)">Network error — '+esc(e.message)+'</span>'; }
  btn.disabled=false;
}

function initUpload(){
  const drop=document.getElementById('drop'), input=document.getElementById('file');
  input.addEventListener('change', ()=>{ if(input.files[0]) handleFile(input.files[0]); });
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
}

window.idsOnAuth=function(u){
  const email=String((u&&u.email)||'').toLowerCase();
  if(MANAGER_EMAILS.indexOf(email)===-1){
    document.getElementById('gate').innerHTML='<div style="font-size:40px">🔒</div><h2 style="color:#EA4335;margin:10px 0">Access restricted</h2><p style="color:rgba(255,255,255,.5);font-size:13px">Attendance import is available to Siddharth &amp; Astha only.</p>';
    return;
  }
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  initUpload();
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getLists'})})
    .then(r=>r.json()).then(d=>{ ROSTER=(d.allMembers||[]).filter(Boolean); })
    .catch(()=>{});
};
</script>
