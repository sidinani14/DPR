<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS · Projects Health</title>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--surface:#1A1A1A;--surface2:#202020;--border:#2E2E2E;--text:#F0EDE8;--text2:#9A9690;--text3:#5A5652;--accent:#C8A96E;--green:#4A9B6F;--amber:#D9A23B;--red:#E0556B;--blue:#4A7FC8;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:15px 20px;position:sticky;top:0;z-index:50}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent)}
.logo small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);font-weight:400;margin-top:2px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{font-family:'DM Sans';font-size:12px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none;cursor:pointer}
.btn{font-size:11px;color:var(--accent);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.25);border-radius:6px;padding:7px 12px;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px 20px 50px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.scell{background:var(--surface2);padding:12px;text-align:center}
.sval{font-size:22px;font-family:'DM Mono',monospace;font-weight:500}
.sval.red{color:var(--red)}.sval.amber{color:var(--amber)}.sval.blue{color:var(--blue)}
.slbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.grey{background:#555}
.pname{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{font-size:9px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px 7px;white-space:nowrap}
.crow{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11px;color:var(--text3)}
.crow b{color:var(--text2);font-weight:500}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.flag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.f-red{background:rgba(224,85,107,.16);color:var(--red)}
.f-amber{background:rgba(217,162,59,.16);color:var(--amber)}
.f-blue{background:rgba(74,127,200,.16);color:var(--blue)}
.f-grey{background:rgba(120,120,130,.18);color:#7A7E88}
.lead{font-size:10px;color:var(--text3);margin-top:7px}
h2.sec{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin:26px 0 10px}
table.leads{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table.leads th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
table.leads td{font-size:12px;padding:9px 12px;border-top:1px solid var(--border);color:var(--text2)}
table.leads tr{cursor:pointer}
table.leads tr:hover td{background:var(--surface2)}
.lp{font-weight:600;color:var(--text)}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--surface);border-left:1px solid var(--border);z-index:101;transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:18px 18px 40px}
.drawer.open{transform:translateX(0)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.dh h3{font-family:'Syne';font-size:18px;font-weight:700}
.dclose{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1}
.dsub{font-size:11px;color:var(--text3);margin-bottom:14px}
.dsec{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 7px}
.ditem{font-size:12px;padding:7px 9px;background:var(--surface2);border-radius:6px;margin-bottom:5px;color:var(--text2)}
.ditem b{color:var(--text);font-weight:600}
.dpill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:5px}
.di-open{background:rgba(224,85,107,.18);color:var(--red)}
.di-esc{background:rgba(217,162,59,.18);color:var(--amber)}
.dempty{font-size:11px;color:var(--text3);font-style:italic;padding:3px 0}
.dgrid{display:flex;gap:10px}.dgrid>div{flex:1;background:var(--surface2);border-radius:6px;padding:9px;text-align:center}
.dgrid .v{font-family:'DM Mono';font-size:13px;color:var(--text)}.dgrid .l{font-size:9px;color:var(--text3);margin-top:2px;text-transform:uppercase}
.skel{height:90px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--radius)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.status-line{max-width:1100px;margin:0 auto;padding:6px 20px 0;font-size:11px;color:var(--text3)}
@media(max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
  <div class="logo">IDEAFORM · Projects Health<small>which projects need attention today</small></div>
  <div class="controls">
    <select class="sel" id="lead-filter" onchange="render()"><option value="all">All leads</option></select>
    <select class="sel" id="status-filter" onchange="render()">
      <option value="all">All statuses</option>
      <option value="ontrack">On Track</option>
      <option value="neglected">Neglected</option>
      <option value="payment">Payment Overdue</option>
      <option value="behind">Behind Schedule</option>
      <option value="visit">Site Visit / Meeting Overdue</option>
      <option value="stalled">Stalled</option>
    </select>
    <button class="btn" onclick="load()">↻ Refresh</button>
  </div>
</div></div>
<div class="status-line" id="status-line">Loading…</div>
<div class="wrap" id="wrap"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>

<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxoYY488eYAomVcsP9h3TwlYZIWDg0gmn4qrCyUiJbriAUIRJr_19VH0RM3NRZPBUoKYA/exec';
let DATA={projects:[],newLeads:[],counts:{}};

function api(action, extra){ return fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action},extra||{}))}).then(r=>r.json()); }
function daysAgo(d){ if(!d) return null; return Math.round((Date.now()-new Date(d).getTime())/86400000); }
function ago(d){ const n=daysAgo(d); return n===null?'never':(n<=0?'today':n+'d ago'); }
function shortD(d){ if(!d) return '—'; const p=d.split('-'); return p[2]+'/'+p[1]; }

async function load(){
  document.getElementById('status-line').textContent='Loading…';
  try{
    DATA=await api('getProjectsHealth');
    if(DATA.error) throw new Error(DATA.error);
    // lead filter options
    const leads=[...new Set((DATA.projects||[]).map(p=>p.lead).filter(Boolean))].sort();
    const lf=document.getElementById('lead-filter'); const cur=lf.value;
    lf.innerHTML='<option value="all">All leads</option>'+leads.map(l=>`<option value="${l}">${l}</option>`).join('');
    if(cur && leads.includes(cur)) lf.value=cur;
    render();
    document.getElementById('status-line').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('status-line').textContent='Error: '+e.message;
    document.getElementById('wrap').innerHTML=`<div style="color:var(--red);font-size:13px;padding:20px">Couldn't load: ${e.message}</div>`; }
}

function passStatus(p,f){
  if(f==='all') return true;
  if(f==='ontrack') return p.rag==='green';
  if(f==='neglected') return p.neglected;
  if(f==='payment') return p.paymentOverdue;
  if(f==='behind') return p.behind;
  if(f==='visit') return p.engagementOverdue;
  if(f==='stalled') return p.stalled;
  return true;
}

function render(){
  const lead=document.getElementById('lead-filter').value;
  const sf=document.getElementById('status-filter').value;
  const c=DATA.counts||{};
  let cards=(DATA.projects||[]).filter(p=>(lead==='all'||p.lead===lead) && passStatus(p,sf));
  const strip=`<div class="strip">
    <div class="scell"><div class="sval">${c.total||0}</div><div class="slbl">Projects</div></div>
    <div class="scell"><div class="sval ${c.neglected?'red':''}">${c.neglected||0}</div><div class="slbl">Neglected</div></div>
    <div class="scell"><div class="sval ${c.paymentOverdue?'red':''}">${c.paymentOverdue||0}</div><div class="slbl">Payment Overdue</div></div>
    <div class="scell"><div class="sval ${c.behind?'amber':''}">${c.behind||0}</div><div class="slbl">Behind</div></div>
    <div class="scell"><div class="sval ${c.engagementOverdue?'amber':''}">${c.engagementOverdue||0}</div><div class="slbl">Visit Overdue</div></div>
  </div>`;
  const cardsHtml = cards.length ? `<div class="grid">`+cards.map(cardHtml).join('')+`</div>` :
    `<div style="color:var(--text3);font-size:13px;padding:20px">No projects match.</div>`;
  // New leads table
  const nl=DATA.newLeads||[];
  const leadsHtml = nl.length ? `<h2 class="sec">New Leads — pipeline (${nl.length})</h2>
    <table class="leads"><tr><th>Project</th><th>Status</th><th>Last Connection</th><th>By</th><th>Tasks</th></tr>`
    + nl.map(l=>`<tr onclick="openDrawer('${(l.project||'').replace(/'/g,"\\'")}')">
        <td class="lp">${l.project}</td><td>${l.status||'—'}</td><td>${l.lastConnection?shortD(l.lastConnection)+' ('+ago(l.lastConnection)+')':'—'}</td>
        <td>${l.connBy||'—'}</td><td>${l.tasks||0}</td></tr>`).join('')+`</table>` : '';
  document.getElementById('wrap').innerHTML=strip+cardsHtml+leadsHtml;
}

function cardHtml(p){
  const flags=[];
  if(p.stalled) flags.push('<span class="flag f-grey">⏸ Stalled</span>');
  if(p.neglected) flags.push('<span class="flag f-red">🔴 Neglected</span>');
  if(p.paymentOverdue) flags.push('<span class="flag f-red">💰 Payment overdue</span>');
  if(p.behind) flags.push('<span class="flag f-amber">⚠ Behind</span>');
  if(p.engagementOverdue) flags.push('<span class="flag f-amber">🏗️ Visit overdue</span>');
  if(p.openIssues) flags.push(`<span class="flag f-blue">${p.openIssues} open issue${p.openIssues>1?'s':''}</span>`);
  const bill={overdue:'⚠ overdue',due:'due',cleared:'✓ cleared','—':'—'}[p.billStatus]||p.billStatus;
  return `<div class="card" onclick="openDrawer('${(p.name||'').replace(/'/g,"\\'")}')">
    <div class="card-top"><span class="dot ${p.rag}"></span><span class="pname">${p.name}</span><span class="stage">${p.stage}</span></div>
    <div class="crow">
      <span>Last connect: <b>${ago(p.lastActivity||p.lastConn)}</b></span>
      <span>This wk: <b>${p.tasksThisWeek}</b></span>
      <span>Open tasks: <b>${p.openTasks}</b></span>
    </div>
    <div class="crow">
      <span>Bill: <b>${bill}</b></span>
      <span>Visit: <b>${shortD(p.lastVisit)}</b></span>
      <span>Meeting: <b>${shortD(p.lastMeeting||p.lastConn)}</b></span>
    </div>
    ${flags.length?`<div class="flags">${flags.join('')}</div>`:''}
    ${p.lead?`<div class="lead">Lead: ${p.lead}${p.client?' · '+p.client:''}</div>`:''}
  </div>`;
}

async function openDrawer(project){
  const bg=document.getElementById('drawer-bg'), d=document.getElementById('drawer');
  bg.classList.add('open'); d.classList.add('open'); window._drawerProject=project;
  d.innerHTML=`<div class="dh"><h3>${project}</h3><button class="dclose" onclick="closeDrawer()">×</button></div><div class="dsub">loading…</div>`;
  try{
    const [x, mt]=await Promise.all([api('getProjectDetail',{project}), api('getMeetingTimeline',{project}).catch(()=>({meetings:[]}))]);
    const iss=(x.openIssues||[]), tasks=(x.tasks||[]), visits=(x.siteVisits||[]), conns=(x.connections||[]);
    const meets=(mt&&mt.meetings)||[];
    const canDel=isSiddharth();
    const mHtml = meets.length? meets.map(m=>`<div class="ditem"><b>${shortD(m.date)}</b> · ${m.type||''} · ${m.loggedBy||''} <span class="dpill ${m.status==='Final'?'di-esc':'di-open'}">${m.status||m.approved||'Draft'}</span>${m.pdfId?' <a href="https://drive.google.com/file/d/'+m.pdfId+'/view" target="_blank" style="font-size:11px">PDF</a>':''}${canDel&&m.logId?` <button onclick="doDeleteLog('${m.logId}')" style="font-size:10px;color:#C0392B;background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;margin-left:4px">Delete</button>`:''}</div>`).join('') : '<div class="dempty">No meetings/visits logged</div>';
    const bills=(x.billables||[]), others=(x.otherActivities||[]);
    const billHtml = bills.length? bills.map(b=>`<div class="ditem"><b>${shortD(b.date)}</b> · ${b.discipline||''} · ${b.stage||''} <span class="dpill di-open">${b.status||''}</span> <span style="font-size:11px;color:var(--text3)">${b.raisedBy||''}</span></div>`).join('') : '<div class="dempty">No billables raised</div>';
    const othHtml = others.length? others.slice(0,12).map(o=>`<div class="ditem"><b>${shortD(o.date)}</b> · ${o.type||''} · ${o.by||''}${o.notes?'<br><span style="font-size:11px">'+o.notes+'</span>':''}</div>`).join('') : '<div class="dempty">No other activities</div>';
    const tord={Delayed:0,'In Progress':1,Ongoing:1,Done:3};
    const issHtml = iss.length? iss.map(i=>`<div class="ditem"><b>${i.desc||i.type||'Issue'}</b><span class="dpill ${i.status==='Open'?'di-open':'di-esc'}">${i.status}</span><br><span style="font-size:11px">${i.assignedTo||'—'} · due ${shortD(i.targetDate)}</span></div>`).join('') : '<div class="dempty">No open issues 🎉</div>';
    const acts=(x.actionItems||[]);
    const actHtml = acts.length? acts.map(a=>`<div class="ditem"><b>${a.category||'—'}</b>${a.owner?' · '+a.owner:''} <span class="dpill ${a.status==='Open'?'di-open':'di-esc'}">${a.status||'Open'}</span><br><span style="font-size:11px">${a.text||''}</span> <span style="color:var(--text3);font-size:10px">${shortD(a.date)}</span></div>`).join('') : '<div class="dempty">No action items from logs</div>';
    const tHtml = tasks.length? tasks.map(t=>`<div class="ditem"><b>${t.taskType}</b> · ${t.selfStatus||'—'}<br><span style="font-size:11px">${t.assignedTo} · due ${shortD(t.deadline)}</span></div>`).join('') : '<div class="dempty">No tasks this week</div>';
    const vHtml = visits.length? visits.map(v=>`<div class="ditem"><b>${shortD(v.date)}</b> · ${v.who||'—'}${v.hours?' · '+v.hours+'h':''} <span style="color:var(--text3)">${v.type||''}</span></div>`).join('') : '<div class="dempty">No site visits logged</div>';
    const cHtml = conns.length? conns.slice(0,12).map(co=>`<div class="ditem"><b>${shortD(co.date)}</b> · ${co.type||''} · ${co.by||''}${co.notes?'<br><span style="font-size:11px">'+co.notes+'</span>':''}</div>`).join('') : '<div class="dempty">No connections logged</div>';
    d.innerHTML=`<div class="dh"><h3>${project}</h3><button class="dclose" onclick="closeDrawer()">×</button></div>
      <div class="dsub">Last bill raised: ${shortD(x.lastBillRaised)} · Last payment cleared: ${shortD(x.lastPayCleared)}${x.dperPct?' · Progress: '+x.dperPct+'%':''}</div>
      <div class="dsec">Open Issues (${iss.length})</div>${issHtml}
      <div class="dsec">Action Items — from meeting/site logs (${acts.length})</div>${actHtml}
      <div class="dsec">Tasks this week (${tasks.length})</div>${tHtml}
      <div class="dsec">Site visits done (${visits.length})</div>${vHtml}
      <div class="dsec">Meetings & Decisions (${meets.length})</div>${mHtml}
      <div class="dsec">Connections (${conns.length})</div>${cHtml}
      <div class="dsec">Billables (${bills.length})</div>${billHtml}
      <div class="dsec">Other activities (${others.length})</div>${othHtml}`;
  }catch(e){ d.querySelector('.dsub').textContent='Error: '+e.message; }
}
function closeDrawer(){ document.getElementById('drawer-bg').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
const DIRECTOR_EMAILS=['sidinani14@gmail.com','siddharth@ideaform.in'];
function isSiddharth(){ return !!(window.IDS_USER && DIRECTOR_EMAILS.includes(String(window.IDS_USER.email||'').toLowerCase())); }
async function doDeleteLog(logId){
  if(!confirm('Delete this log permanently and regenerate the PDF? This cannot be undone.')) return;
  try{
    const r=await api('deleteMeetingLog',{logId});
    if(r.status==='ok'){ openDrawer(window._drawerProject); }
    else alert('Could not delete: '+(r.message||'failed'));
  }catch(e){ alert('Network error'); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

window.idsOnAuth = load;   // gated by auth.js
</script>
</body>
</html>
