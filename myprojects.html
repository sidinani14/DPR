<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS · My Projects</title>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--surface:#1A1A1A;--surface2:#202020;--border:#2E2E2E;--text:#F0EDE8;--text2:#9A9690;--text3:#5A5652;--accent:#C8A96E;--green:#4A9B6F;--amber:#C8863A;--red:#C05050;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:50}
.header-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent)}
.logo small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);font-weight:400;margin-top:2px}
.nav-links{display:flex;gap:8px}
.nav-link{font-size:11px;color:var(--text3);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:5px}
.nav-link:hover{color:var(--accent);border-color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:20px}
.intro{font-size:13px;color:var(--text2);margin-bottom:16px}
.intro b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--text3)}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.pname{font-size:14px;font-weight:700;flex:1}
.stage{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.meta{font-size:11px;color:var(--text2);margin:3px 0}
.meta.warn{color:var(--amber)}
.actions{display:flex;gap:7px;margin-top:11px}
.act{flex:1;text-align:center;font-size:11px;font-weight:600;text-decoration:none;padding:7px 6px;border-radius:6px;border:1px solid var(--border);color:var(--text2)}
.act.pri{color:var(--accent);border-color:rgba(200,169,110,.35);background:rgba(200,169,110,.08)}
.act:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}
.skel{height:96px;background:linear-gradient(90deg,var(--border) 25%,var(--surface2) 50%,var(--border) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--radius)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
  <div class="logo">IDEAFORM · My Projects<small>projects you lead — plan visits &amp; 3M</small></div>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="projects.html">All Projects</a>
    <a class="nav-link" href="dashboard.html">Tasks</a>
  </div>
</div></div>

<div class="wrap">
  <div class="intro" id="intro">Loading your projects…</div>
  <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
function post(body){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}).then(r=>r.json()); }
const EXCL=['completed','closed','dead','cancelled','proposal','new lead','hold','on hold'];

window.idsOnAuth = async function(user){
  try{
    const [lists, health] = await Promise.all([ post({action:'getLists'}), post({action:'getProjectsHealth'}) ]);
    // Resolve my member name from my email (team[] and emails[] are parallel)
    const team=lists.team||[], emails=(lists.emails||[]).map(e=>String(e).toLowerCase());
    const myEmail=String((user&&user.email)||'').toLowerCase();
    let me = team[emails.indexOf(myEmail)] || (user&&user.name) || '';
    const projects = (health.projects || health || []);
    const mine = projects.filter(p => leadMatches(p.lead, me) && !EXCL.some(x=>String(p.stage||'').toLowerCase().includes(x)));
    render(me, mine);
  }catch(e){
    document.getElementById('intro').textContent='Could not load projects: '+e.message;
    document.getElementById('grid').innerHTML='';
  }
};

function leadMatches(lead, me){
  lead=String(lead||'').trim().toLowerCase(); me=String(me||'').trim().toLowerCase();
  if(!lead||!me) return false;
  if(lead===me) return true;
  const lf=lead.split(' ')[0], mf=me.split(' ')[0];
  return lf===mf || lead.indexOf(mf)>-1 || me.indexOf(lf)>-1;
}
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function shortD(d){ if(!d) return ''; const p=String(d).split('-'); return p.length===3? (p[2]+'/'+p[1]) : d; }

function render(me, list){
  const intro=document.getElementById('intro'), grid=document.getElementById('grid');
  intro.innerHTML = me ? `You lead <b>${esc(me)==='' ? '—' : list.length}</b> active project${list.length!==1?'s':''}${me?` · ${esc(me)}`:''}.` : 'Signed in.';
  if(!list.length){ grid.innerHTML=''; document.querySelector('.wrap').insertAdjacentHTML('beforeend','<div class="empty">No active projects are assigned to you as lead.<br>Ask Siddharth to set you as Lead (PROJECTS sheet, column F) to see them here.</div>'); return; }
  const today=new Date().toISOString().substring(0,10);
  grid.innerHTML = list.map(p=>{
    const rag = p.rag || (p.neglected?'red':p.behind?'amber':'green');
    const dot = rag==='red'?'red':rag==='amber'?'amber':'green';
    const q = encodeURIComponent(p.name);
    const visit = p.lastVisit ? ('Last visit '+shortD(p.lastVisit)) : 'No site visit logged yet';
    const visitWarn = !p.lastVisit;
    return `<div class="card">
      <div class="card-top"><span class="dot ${dot}"></span><span class="pname">${esc(p.name)}</span></div>
      <div class="stage">${esc(p.stage||'—')}${p.client?' · '+esc(p.client):''}</div>
      <div class="meta ${visitWarn?'warn':''}">📍 ${visit}</div>
      ${p.lastConn?`<div class="meta">💬 Last contact ${shortD(p.lastConn)}</div>`:''}
      <div class="actions">
        <a class="act pri" href="tasks.html?project=${q}">📋 Plan Tasks</a>
        <a class="act" href="3m.html?project=${q}">📨 3M</a>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
