<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IDS Weekly Performance Report — 1–6 June 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0F1923;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.page{width:297mm;min-height:210mm;padding:10mm 12mm;page-break-after:always;background:#0F1923;position:relative;overflow:hidden;}
.page:last-child{page-break-after:auto;}
.page::before{content:'';position:absolute;top:-80px;right:-80px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,0.07) 0%,transparent 70%);pointer-events:none;}

/* HEADER */
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8mm;padding-bottom:4mm;border-bottom:1px solid rgba(255,255,255,0.08);}
.rh-logo img{height:40px;}
.rh-meta{text-align:right;}
.rh-title{font-size:10px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:1.5px;}
.rh-week{font-size:15px;font-weight:800;color:#fff;margin-top:2px;}
.rh-gen{font-size:8px;color:rgba(255,255,255,0.35);margin-top:3px;}

/* OVERVIEW PAGE */
.ov-title{font-size:20px;font-weight:900;margin-bottom:1mm;}
.ov-title span{color:#F5A623;}
.ov-sub{font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:6mm;letter-spacing:.5px;}
table.tt{width:100%;border-collapse:collapse;}
table.tt thead tr{background:rgba(245,166,35,0.12);}
table.tt thead th{padding:7px 8px;font-size:7.5px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center;}
table.tt thead th:first-child,table.tt thead th:nth-child(2){text-align:left;}
table.tt tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);}
table.tt tbody td{padding:8px 8px;font-size:9.5px;vertical-align:middle;text-align:center;}
table.tt tbody td:first-child,table.tt tbody td:nth-child(2){text-align:left;}
.rk{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;}
.rk1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;}
.rk2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#000;}
.rk3{background:linear-gradient(135deg,#CD7F32,#9A5A1A);color:#fff;}
.rkx{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}
.mn{font-weight:700;font-size:10px;}
.mr{font-size:7.5px;color:rgba(255,255,255,0.4);margin-top:1px;}
.sv{font-size:15px;font-weight:900;}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.c-ex{background:rgba(46,213,115,0.15);color:#2ED573;border:1px solid rgba(46,213,115,0.3);}
.c-go{background:rgba(52,168,83,0.12);color:#34A853;border:1px solid rgba(52,168,83,0.25);}
.c-av{background:rgba(251,188,4,0.12);color:#FBBC04;border:1px solid rgba(251,188,4,0.25);}
.c-lo{background:rgba(234,67,53,0.12);color:#EA4335;border:1px solid rgba(234,67,53,0.25);}
.mb{width:55px;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;display:inline-block;}
.mb-i{height:100%;border-radius:3px;}
.legend{display:flex;gap:16px;margin-top:5mm;align-items:center;}
.lk{font-size:7.5px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;}

/* INDIVIDUAL PAGE */
.ind-top{display:grid;grid-template-columns:1fr 180px;gap:6mm;margin-bottom:6mm;}
.ind-name{font-size:26px;font-weight:900;line-height:1;}
.ind-role{font-size:10px;color:rgba(255,255,255,0.5);margin-top:3px;}
.ind-week-lbl{font-size:8px;color:rgba(255,255,255,0.25);margin-top:6px;text-transform:uppercase;letter-spacing:1px;}
.stats-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.stat-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:6px 10px;text-align:center;}
.stat-val{font-size:16px;font-weight:800;line-height:1;}
.stat-lbl{font-size:6.5px;color:rgba(255,255,255,0.4);margin-top:2px;text-transform:uppercase;letter-spacing:.6px;line-height:1.3;}
.score-box{background:linear-gradient(135deg,rgba(245,166,35,0.12),rgba(245,166,35,0.04));border:1px solid rgba(245,166,35,0.25);border-radius:14px;padding:14px 18px;text-align:center;}
.sc-lbl{font-size:7.5px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1.5px;}
.sc-num{font-size:46px;font-weight:900;line-height:1;margin:3px 0;}
.sc-den{font-size:13px;color:rgba(255,255,255,0.3);font-weight:400;}

/* PARAM CARDS */
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:3mm;margin-bottom:4mm;}
.pc{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px;position:relative;overflow:hidden;}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0;}
.pc.g::before{background:linear-gradient(90deg,#2ED573,#00B894);}
.pc.a::before{background:linear-gradient(90deg,#FBBC04,#F5A623);}
.pc.r::before{background:linear-gradient(90deg,#EA4335,#FF6B6B);}
.pc.o::before{background:linear-gradient(90deg,#F5A623,#FF8C00);}
.pc.gr::before{background:rgba(255,255,255,0.1);}
.pc-lbl{font-size:6.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;line-height:1.4;}
.pc-val{font-size:22px;font-weight:900;line-height:1;}
.pc-max{font-size:9px;color:rgba(255,255,255,0.25);font-weight:400;}
.pc-det{font-size:7px;color:rgba(255,255,255,0.35);margin-top:5px;line-height:1.5;}
.pw{height:4px;background:rgba(255,255,255,0.07);border-radius:2px;margin-top:7px;overflow:hidden;}
.pb{height:100%;border-radius:2px;}
.pb-g{background:linear-gradient(90deg,#2ED573,#00B894);}
.pb-a{background:linear-gradient(90deg,#FBBC04,#F5A623);}
.pb-r{background:linear-gradient(90deg,#EA4335,#FF6B6B);}
.pb-o{background:linear-gradient(90deg,#F5A623,#FF8C00);}
.pb-gr{background:rgba(255,255,255,0.15);}

/* ATTENDANCE */
.ag{display:grid;grid-template-columns:repeat(6,1fr);gap:3mm;margin-bottom:4mm;}
.ad{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:7px 5px;text-align:center;}
.ad.ap{border-color:rgba(46,213,115,0.15);}
.ad.al{border-color:rgba(251,188,4,0.25);background:rgba(251,188,4,0.04);}
.ad.aa{border-color:rgba(234,67,53,0.15);background:rgba(234,67,53,0.03);}
.ad.ah{border-color:rgba(245,166,35,0.15);}
.ad-day{font-size:6.5px;color:rgba(255,255,255,0.35);margin-bottom:3px;text-transform:uppercase;}
.ad-time{font-size:10px;font-weight:700;}
.ad-st{font-size:6.5px;margin-top:2px;}

/* TASKS TABLE */
.tt-sec{margin-top:3mm;}
.tt-sec-title{font-size:8px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3mm;}
table.tasks{width:100%;border-collapse:collapse;}
table.tasks thead th{background:rgba(255,255,255,0.06);padding:5px 8px;font-size:7.5px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.7px;text-align:left;}
table.tasks thead th:last-child,table.tasks thead th:nth-last-child(2){text-align:center;}
table.tasks tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);}
table.tasks tbody td{padding:5px 8px;font-size:8.5px;vertical-align:middle;}
table.tasks tbody td:last-child,table.tasks tbody td:nth-last-child(2){text-align:center;}
.t-proj{font-weight:600;color:#F5A623;font-size:8px;}
.t-task{color:rgba(255,255,255,0.85);}
.t-date{font-size:8px;color:rgba(255,255,255,0.5);font-family:monospace;}
.t-pts{font-weight:700;font-size:10px;}
.ot-yes{color:#2ED573;}
.ot-no{color:#EA4335;}
.no-tasks{font-size:9px;color:rgba(255,255,255,0.3);font-style:italic;padding:8px;}

/* IMPROVE BOX */
.ib{background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(234,67,53,0.04));border:1px solid rgba(245,166,35,0.2);border-radius:10px;padding:10px 12px;}
.ib-title{font-size:8px;font-weight:800;color:#F5A623;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.ib-title::before{content:"💡 ";}
.ib-item{font-size:8px;color:rgba(255,255,255,0.65);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);line-height:1.4;}
.ib-item:last-child{border-bottom:none;padding-bottom:0;}

.section-title{font-size:8px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3mm;}
.loading{text-align:center;padding:40px;color:rgba(255,255,255,0.4);font-size:14px;}
.edit-btn{position:fixed;bottom:20px;right:20px;background:rgba(245,166,35,0.9);color:#000;padding:10px 18px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;z-index:1000;border:none;font-family:inherit;}
.edit-btn:hover{background:#F5A623;}
@media print{.edit-btn{display:none;}@page{size:A4 landscape;margin:0;}}
[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed rgba(245,166,35,0.3);}
[contenteditable]:focus{background:rgba(245,166,35,0.06);border-radius:3px;}
</style>
</head>

// ── Score calculation ─────────────────────────────────────
function scoreCalc(m, taskData) {
  const bio         = BIO[m.name] || {};
  const tgt         = TARGETS[m.name] || 48;
  const approvedPts = taskData.approvedPts || 0;
  const dprDays     = taskData.dprDays     || 0;

  // Output /50
  const s_output = Math.min(50, Math.round(approvedPts / tgt * 50 * 10) / 10);

  // DPR /15
  const effectiveDprDays = dprDays || 0;
  const s_dpr = Math.min(15, Math.round(effectiveDprDays / WEEK_DAYS * 15 * 10) / 10);

  // Punctuality /20 — scaled from biometric base (/15) to /20
  const absentDays  = WEEK_DAYS - (bio.days || WEEK_DAYS);
  const punctBase   = bio.punctScore ?? 15;
  const punctScaled = Math.round(punctBase / 15 * 20 * 10) / 10;
  const s_punct     = Math.max(0, Math.round((punctScaled - absentDays * 2.0) * 10) / 10);

  // Hours /15 — scaled from biometric base (/10) to /15
  const hrsBase   = bio.hrsScore ?? 7;
  const hrsScaled = Math.round(hrsBase / 10 * 15 * 10) / 10;
  const s_hrs     = Math.max(0, Math.round((hrsScaled - absentDays * 1.5) * 10) / 10);

  const total = Math.round((s_output + s_dpr + s_punct + s_hrs) * 10) / 10;

  return {s_output, s_dpr, s_punct, s_hrs,
          total, tgt, approvedPts,
          dprDays: effectiveDprDays,
          completedOT: taskData.completedOnTime || 0,
          completedL : taskData.completedLate   || 0,
          totalDone  : (taskData.completedOnTime||0) + (taskData.completedLate||0)};
}

// ── Colour helpers ────────────────────────────────────────
function sc(v,m){const p=v/m;return p>=.85?'#2ED573':p>=.70?'#34A853':p>=.50?'#FBBC04':'#EA4335';}
function gc(v,m){const p=v/m;return p>=.85?'g':p>=.70?'a':p>=.50?'o':'r';}
function gpc(v,m){const p=v/m;return p>=.85?'pb-g':p>=.70?'pb-a':p>=.50?'pb-o':'pb-r';}
function chip(t){return t>=85?'c-ex':t>=70?'c-go':t>=50?'c-av':'c-lo';}
function chipLabel(t){return t>=85?'Excellent':t>=70?'Good':t>=50?'Average':'Needs Work';}

function attClass(d){if(d.s==='A')return'aa';if(d.l)return'al';if(d.s==='HD')return'ah';return'ap';}
function attColor(d){if(d.s==='A')return'#EA4335';if(d.l)return'#FBBC04';if(d.s==='HD')return'#F5A623';if(d.s==='E')return'rgba(245,166,35,0.7)';return'#2ED573';}
function attLabel(d){if(d.s==='A')return'Absent';if(d.s==='HD')return'Half Day';if(d.s==='E')return d.n||'Early/Site';return d.l?'⚠ Late':'On Time';}

}

        <div style="margin-top:6px"><span class="chip ${chip(s.total)}">${chipLabel(s.total)}</span></div>
      </div>
    </div>

    <div class="section-title" style="margin-bottom:2mm">Score Breakdown</div>
    <div class="pg">
      ${pCard('Site Visits',s.s_visit,20,`${d.visitedCount} of ${d.totalSites} sites visited ≥1×`)}
      ${pCard('Client Comm',s.s_client,10,`${d.clientCount} of ${d.totalSites} projects updated`)}
      ${pCard('Task<br>Completion',s.s_tasks,20,`${d.tasksCompleted} of ${d.tasksAssigned} assigned this week completed`)}
      ${pCard('DPER<br>Consistency',s.s_dper,15,`${d.dperDaysCount} of 6 days · ≥1 submission/day`)}
      ${pCard('Punctuality<br>Biometric',s.s_punct,20,`${d.lateCount} late · ${d.absentDays} absent · Thr: 09:10`)}
      ${pCard('Hours<br>Biometric',s.s_hrs,15,`${d.daysPresent}/6 days present`)}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:4mm">
      <div>
        <div class="section-title" style="margin-bottom:2mm">Site Visit & Client Update — Per Project</div>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:rgba(245,166,35,0.12)">
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:left">Project</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">Visited</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">Client</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">DPER</th>
          </tr></thead>
          <tbody>${projRows}</tbody>
        </table>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:2mm">Task Completion — Due This Week</div>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:rgba(245,166,35,0.12)">
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:left">Project</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:left">Task</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">Who</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">Assigned</th>
            <th style="padding:5px 8px;font-size:7px;font-weight:700;color:#F5A623;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(245,166,35,0.25);text-align:center">Completed</th>
          </tr></thead>
          <tbody>${taskRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ── Main render ────────────────────────────────────────────
async function loadAndRender(){
  const app = document.getElementById('app');
  let statsMap = {}, deepakStats = null;

  if (APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
    try {
      const [res, dRes] = await Promise.all([
        fetch(APPS_SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({action:'getWeeklyStats', weekStart:WEEK_START})}),
        fetch(APPS_SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({action:'getDeepakWeeklyStats', weekStart:WEEK_START})}),
      ]);
      const data  = await res.json();
      const dData = await dRes.json();
      if (data.stats)  data.stats.forEach(s => { statsMap[s.name] = s; });
      if (dData.scores) deepakStats = dData;
    } catch(e) {
      console.warn('Could not fetch stats:', e);
    }
  }

  const team = Object.keys(ROLES).map(name => {
    const taskData = statsMap[name] || {};
    const m = {name, _sc: scoreCalc({name}, taskData)};
    m._taskData = taskData;
    return m;
  });

  const sorted = [...team].sort((a,b)=>b._sc.total-a._sc.total);
  let outHtml = buildOverviewPage(sorted);
  sorted.forEach(m => { outHtml += buildIndividualPage(m, m._taskData); });
  outHtml += buildDeepakPage(deepakStats);
  app.innerHTML = outHtml;
}

loadAndRender();</script>
</body>
</html>
