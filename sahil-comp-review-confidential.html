<meta charset="utf-8">
<title>CONFIDENTIAL — Compensation Review — Sahil Maurya</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="auth.js"></script>
<style>
:root{--bg:#0F1923;--card:#16212E;--line:rgba(255,255,255,.08);--t1:#fff;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.42);--accent:#F5A623;--red:#EA4335;--amber:#FBBC04;--green:#2ED573;--blue:#4F9DF7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',system-ui,-apple-system,sans-serif;line-height:1.5;padding:0 0 50px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.confbar{background:var(--red);color:#fff;text-align:center;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:7px}
.rh{display:flex;align-items:center;gap:16px;padding:22px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.rh h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.rh .sub{font-size:11.5px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:1.2px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px}
h2{font-size:11.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.tile .v{font-size:19px;font-weight:800;letter-spacing:-.3px}
.tile .l{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.tile .x{font-size:10px;color:var(--t2);margin-top:3px}
.grade-box{display:flex;align-items:center;gap:20px;background:rgba(234,67,53,.07);border:1px solid rgba(234,67,53,.3);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.grade-letter{font-size:44px;font-weight:900;color:var(--red);line-height:1}
.grade-label{font-size:14px;font-weight:700;color:var(--t1)}
.grade-sub{font-size:12px;color:var(--t2);margin-top:3px}
.inc-box{display:flex;align-items:center;gap:20px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.3);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.inc-num{font-size:36px;font-weight:900;color:var(--accent);line-height:1}
ul{margin:6px 0 0 18px;font-size:12.5px;color:var(--t2);line-height:1.6}
li{margin-bottom:3px}
li b{color:var(--t1)}
.pathgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--t2)}
td.n,th.n{text-align:center}
.foot{font-size:10px;color:var(--t3);text-align:center;padding:12px 0}
.loading{color:var(--t3);font-size:13px;padding:20px 0;text-align:center}
@media(max-width:680px){.pathgrid{grid-template-columns:1fr}}
@page{size:A4;margin:12mm}
@media print{
html,body{background:var(--bg) !important;color:var(--t1) !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;font-size:10.5pt}
*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
section{background:var(--card) !important;border:1px solid var(--line) !important;break-inside:avoid-page;margin-bottom:10px}
.confbar{position:fixed;top:0;left:0;right:0}
}
</style>

<div id="gate" style="max-width:430px;margin:16vh auto;text-align:center;color:var(--t2);padding:20px">
  <div style="font-size:40px">🔒</div>
  <h2 style="color:var(--accent);margin:10px 0 6px;letter-spacing:1px">Confidential Document</h2>
  <p style="font-size:13px;color:var(--t3)">Sign in with an authorised Ideaform account (Siddharth / Astha).</p>
</div>

<div id="app" class="wrap" style="display:none"></div>

<script>
// This page is intentionally a shell — it carries no grade, increment, or
// reasoning text in its own source. Everything is fetched at load time from
// getConfidentialReview, a MANAGER_ONLY backend route (verifyIdToken +
// isManager enforced server-side). Viewing this file's raw source reveals
// nothing; the real protection is the authenticated fetch, same as every
// other manager-only page in this system.
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyyHnaAJ35ry0ot5HrWfz-IGaiM5algp4LLbTU8YtUwb9cvGhbCXkQZOYgMnY2CQ-Y5vA/exec';
const MEMBER='Sahil Maurya';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderPayload(p){
  const app=document.getElementById('app'); app.style.display='block';
  const tileHtml=(p.tiles||[]).map(t=>`<div class="tile"><div class="v" style="color:${t.color||'var(--t1)'}">${esc(t.v)}</div><div class="l">${esc(t.l)}</div><div class="x">${esc(t.x||'')}</div></div>`).join('');
  const reasonsHtml=(p.reasons||[]).map(r=>`<li><b>${esc(r.lead)}</b> ${esc(r.text)}</li>`).join('');
  const typeRows=(p.taskTypeTable||[]).map(r=>`<tr><td>${esc(r.category)}</td><td class="n">${esc(r.pts)}</td><td class="n" style="color:${r.lateColor||'inherit'}">${esc(r.lateLabel)}</td></tr>`).join('');
  const pathHtml=(p.pathForward||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  app.innerHTML=`
    <div class="confbar">Confidential — Internal / HR Use Only — Not for Employee Distribution</div>
    <div class="rh"><div><h1>Compensation &amp; Role Review — ${esc(p.member)}</h1><div class="sub">${esc(p.role)} · ${esc(p.window)}</div></div></div>

    <div class="grade-box">
      <div class="grade-letter">${esc(p.gradeLetter)}</div>
      <div>
        <div class="grade-label">Overall Grade: ${esc(p.gradeLabel)}</div>
        <div class="grade-sub">${esc(p.gradeSummary)}</div>
      </div>
    </div>

    <section>
      <h2>This Cycle at a Glance</h2>
      <div class="tiles">${tileHtml}</div>
    </section>

    <div class="inc-box">
      <div class="inc-num">${esc(p.incrementPct)}%</div>
      <div>
        <div class="grade-label">${esc(p.incrementLabel)}</div>
        <div class="grade-sub">${esc(p.incrementSub)}</div>
      </div>
    </div>

    <section>
      <h2>${esc(p.reasonsHeading)}</h2>
      <ul>${reasonsHtml}</ul>
    </section>

    <section>
      <h2>${esc(p.strengthsHeading)}</h2>
      <div class="pathgrid">
        <div>
          <div style="font-size:12px;color:var(--t2);line-height:1.6">${esc(p.strengthsIntro)}</div>
          <table>
            <thead><tr><th>Task type</th><th class="n">Pts</th><th class="n">Late</th></tr></thead>
            <tbody>${typeRows}</tbody>
          </table>
        </div>
        <div style="font-size:12.5px;color:var(--t2);line-height:1.7">${p.strengthsNote||''}</div>
      </div>
    </section>

    <section>
      <h2>${esc(p.pathHeading)}</h2>
      <ul>${pathHtml}</ul>
      <div style="font-size:12px;color:var(--t2);margin-top:8px;line-height:1.6">${p.pathFooter||''}</div>
    </section>

    <div class="foot">© Ideaform Design Studio · Confidential Compensation Review · ${esc(p.window)} · Internal / HR use only — do not share with employee${p.savedAt?' · saved '+esc(p.savedAt):''}</div>`;
}

function load(){
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getConfidentialReview',member:MEMBER})})
    .then(r=>r.json()).then(res=>{
      if (!res || res.status!=='ok') { document.getElementById('app').style.display='block'; document.getElementById('app').innerHTML='<div class="loading">No confidential review found for '+esc(MEMBER)+' yet.</div>'; return; }
      renderPayload(res.payload);
    })
    .catch(e=>{ document.getElementById('app').style.display='block'; document.getElementById('app').innerHTML='<div class="loading">Could not load — '+esc(e.message)+'. Check sign-in.</div>'; });
}

window.idsOnAuth=function(u){
  const email=String((u&&u.email)||'').toLowerCase();
  if(['siddharth@ideaform.in','sidinani14@gmail.com','astha@ideaform.in','astha.uch@gmail.com'].indexOf(email)===-1){
    document.getElementById('gate').innerHTML='<div style="font-size:40px">🔒</div><h2 style="color:#EA4335;margin:10px 0">Access restricted</h2><p style="color:rgba(255,255,255,.5);font-size:13px">This document is available to Siddharth &amp; Astha only.</p>';
    return;
  }
  document.getElementById('gate').style.display='none';
  load();
};
</script>
